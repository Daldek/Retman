[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "retman"
dynamic = ["version"]
description = "Polecenia w języku naturalnym dla narzędzi hydrologicznych"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
retman = "retman.cli:main"
retman-eval = "retman.eval.runner:main"

[project.urls]
Repository = "https://github.com/Daldek/Retman"

[dependency-groups]
# Tools used by handler tests and manual smoke runs (ARCHITECTURE 3.2.7, ADR-003).
# Not a runtime dependency of Retman (ARCHITECTURE 9.3).
tools = ["kartograf @ git+https://github.com/Daldek/Kartograf@v0.7.2"]

[tool.hatch.version]
path = "retman/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["retman"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Markdown code blocks are documentation examples, some deliberately "BAD"
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["kartograf", "kartograf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs network or a running model server; run deliberately (-m live)",
]

[tool.coverage.run]
source = ["retman"]

[tool.coverage.report]
fail_under = 80
