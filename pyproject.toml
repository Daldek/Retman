[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "retman"
dynamic = ["version"]
description = "Polish natural-language commands for the Nogat hydrology tools (Kartograf, IMGWTools): recognises the operation, asks for what is missing, shows a plan to confirm, then runs it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
requires-python = ">=3.12"
keywords = [
    "natural-language",
    "hydrology",
    "gis",
    "polish",
    "command-line",
    "assistant",
    "kartograf",
    "imgw",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
retman = "retman.cli:main"
retman-eval = "retman.eval.runner:main"
retman-scaffold = "retman.devtools.scaffold:main"

[project.urls]
Homepage = "https://github.com/Daldek/Retman"
Source = "https://github.com/Daldek/Retman.git"
Documentation = "https://github.com/Daldek/Retman/blob/main/docs/USAGE.md"
Changelog = "https://github.com/Daldek/Retman/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/Daldek/Retman/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.18",
]
# Tools used by handler tests and manual smoke runs (ARCHITECTURE 3.2.7, ADR-003).
# Not a runtime dependency of Retman (ARCHITECTURE 9.3). Pushed release commits
# until the tags v0.8.0 and v3.0.0 exist; then pin the tags.
tools = [
    "kartograf @ git+https://github.com/Daldek/Kartograf@8e9bcbb058d11f06afae5a65e62f31870f69d169",
    "imgwtools[store] @ git+https://github.com/Daldek/IMGWTools@0d98f3babeeeee49b2146a977b62bfa92114beea",
]

[tool.uv]
# `uv sync --locked --all-extras` (the gate, CI) installs the development tools and the
# tools Retman adapts, so the conformance tests run against them (DEV-6.3).
default-groups = ["dev", "tools"]

[tool.hatch.version]
path = "src/retman/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/retman"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Markdown code blocks are documentation examples, some deliberately "BAD"
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Folders without __init__.py are no packages: tests/integration/tools/<tool>/
# carries the tool's name, and as a PEP 420 namespace package it would shadow an
# installed tool that ships no py.typed (imgwtools), so `import imgwtools` in a test
# would resolve to the test folder and every attribute of the tool would be "missing"
namespace_packages = false

[[tool.mypy.overrides]]
# The tools Retman adapts and jsonschema (contract tests) ship no usable type
# information; their imports are not checked
module = [
    "kartograf",
    "kartograf.*",
    "imgwtools",
    "imgwtools.*",
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Shortfall of these test modules (DEV-7.3; a deviation listed in CLAUDE.md): helpers and
# fixtures are not annotated. Modules are named by file name because the test folders
# are not packages (namespace_packages = false); a new test module is strict, and a
# module leaves the list when it is annotated.
module = [
    "conftest",
    "dummy_tool.crowded",
    "test_catalog",
    "test_check",
    "test_cli",
    "test_config",
    "test_coordinates",
    "test_crs",
    "test_doctor",
    "test_factory",
    "test_fake_decision",
    "test_geometry",
    "test_imgw_archives_runs",
    "test_imgw_calls",
    "test_imgw_check",
    "test_imgw_client",
    "test_imgw_coverage",
    "test_imgw_describe",
    "test_imgw_eval",
    "test_imgw_manifest",
    "test_imgw_pipeline",
    "test_imgw_preview",
    "test_initialize",
    "test_kartograf_calls",
    "test_loader",
    "test_manifest_adapter",
    "test_openai_compatible",
    "test_openai_compatible_live",
    "test_pipeline",
    "test_plan_review",
    "test_preview_and_check",
    "test_recognition",
    "test_runner",
    "test_runner_cli",
    "test_runner_live",
    "test_stores",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run and the gate exclude `live` (DEV-10.1); `-m live` replaces it.
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: needs network or a running model server; run deliberately (-m live)",
    "slow: more than ~10 s or Docker (none in this project)",
    "db: needs a database (none in this project)",
]

[tool.coverage.run]
source = ["retman"]

[tool.coverage.report]
fail_under = 80
