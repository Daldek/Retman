[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "retman"
dynamic = ["version"]
description = "Polecenia w języku naturalnym dla narzędzi hydrologicznych"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
retman = "retman.cli:main"
retman-eval = "retman.eval.runner:main"
retman-scaffold = "retman.devtools.scaffold:main"

[project.urls]
Repository = "https://github.com/Daldek/Retman"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Tools used by handler tests and manual smoke runs (ARCHITECTURE 3.2.7, ADR-003).
# Not a runtime dependency of Retman (ARCHITECTURE 9.3). Pushed release commits
# until the tags v0.8.0 and v3.0.0 exist; then pin the tags.
tools = [
    "kartograf @ git+https://github.com/Daldek/Kartograf@8e9bcbb058d11f06afae5a65e62f31870f69d169",
    "imgwtools[store] @ git+https://github.com/Daldek/IMGWTools@0d98f3babeeeee49b2146a977b62bfa92114beea",
]

[tool.uv]
# `uv sync --locked --all-extras` (the gate, CI) installs the development tools and the
# tools Retman adapts, so the conformance tests run against them (DEV-6.3).
default-groups = ["dev", "tools"]

[tool.hatch.version]
path = "retman/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["retman"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Markdown code blocks are documentation examples, some deliberately "BAD"
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Folders without __init__.py are no packages: tests/tools/<tool>/ carries the
# tool's name, and as a PEP 420 namespace package it would shadow an installed
# tool that ships no py.typed (imgwtools), so `import imgwtools` in a test would
# resolve to the test folder and every attribute of the tool would be "missing"
namespace_packages = false

[[tool.mypy.overrides]]
module = ["kartograf", "kartograf.*", "imgwtools", "imgwtools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run and the gate exclude `live` (DEV-10.1); `-m live` replaces it.
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: needs network or a running model server; run deliberately (-m live)",
    "slow: more than ~10 s or Docker (none in this project)",
    "db: needs a database (none in this project)",
]

[tool.coverage.run]
source = ["retman"]

[tool.coverage.report]
fail_under = 80
