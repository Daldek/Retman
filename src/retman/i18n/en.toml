# Wizard retman config init: tool stores and the IMGWTools store (retman/initialize.py).
[init]
stores_question = "Where should the data downloaded by the tools (Kartograf, IMGWTools) be kept?\nThe stores are two separate folders inside the chosen folder — kartograf and imgw — so both are on the same drive. Choose a drive with plenty of space: rasters and archives take gigabytes, and the stores are shared by all projects.\nThe Kartograf cache file will go to the user's local drive: {cache}."
stores_prompt = "Folder for the stores [Enter = {path}]: "
stores_not_absolute = "Enter an absolute path, without “..”."
folder_failed = "Cannot create folder {path}: {error}. The configuration file was not saved; run retman config init again and specify a different folder."
stores_summary = "Tool stores ([retman.tools.*] settings in the file):\n  Kartograf: {kartograf}\n  IMGWTools: {imgwtools}"
not_created = "The store folders were not created (no terminal): Kartograf will create its own on first download, and you can create the IMGWTools store with the command “Create IMGW store”."
imgw_question = "Create the IMGWTools store in {path} now?\nCreation does not use the network: a store marker is written into an empty folder, or into a folder that already has the layout of a store after IMGWTools checks it. Without a store, IMGW data operations that save locally do not work."
