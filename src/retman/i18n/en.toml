imgw_ok = "IMGWTools store ready: {path}"
imgw_existing = "IMGWTools store already exists: {path}"
imgw_declined = "The IMGWTools store was not created; you can create it with the command “Create IMGW store”."
imgw_not_installed = "IMGWTools is not installed, so the store {path} was not created; after installation you can create it with the command “Create IMGW store” (retman doctor check will suggest how to install it)."
imgw_refused = "IMGWTools did not create the store in {path}: {detail}"
imgw_not_atomic = "IMGWTools did not create the store in {path}: the file system does not support hard links ({detail}). Tool stores require a drive with hard links (FAT/exFAT and some network shares lack them) — change [retman.tools.imgwtools] store_dir and [retman.tools.kartograf] store_dir in the settings file to folders on another drive."
