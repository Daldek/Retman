# Station readings (src/retman/extractors/stations.py, places.py): question labels and texts for the plan.
[extractors.station]
hydro = "{name} — {provider} hydrological station, code {code}"
hydro_river = "{name} — {provider} hydrological station on the river {river}, code {code}"
meteo = "{name} — {provider} meteorological station, code {code}"
code_only = "station with code {code} ({provider}, not in the catalog)"
too_many = "too many stations ({count})"

[extractors.query]
fragment = "phrase “{text}” (from “{raw}”)"

[extractors.synop_station]
code = "synoptic station with code {code}"
name = "synoptic station whose name contains “{name}” (from “{raw}”)"

[extractors.identifier]
name = "name “{name}”"

# Readings of the period and year type (src/retman/extractors/dates.py). The single-year and single-day texts
# receive the same arguments as the range texts ({first}, {last} and {start}, {end}).
[extractors.period]
years = "years {first}–{last}"
year = "year {first}"
year_list = "years {years}"
dates = "period from {start} to {end}"
date = "day {start}"

[extractors.year_type]
hydrological = "hydrological year (from 1 November to 31 October)"
calendar = "calendar year (from 1 January to 31 December)"

# Readings of PMAXTP grid points and cells (src/retman/extractors/coordinates.py): the labels show
# how Retman understood the input. Degrees: up to 6 decimal places, metres: up to 2.
[extractors.point]
wgs84_lat_lon = "WGS84 point (order: latitude, longitude): {latitude}° N, {longitude}° E"
wgs84_lon_lat = "WGS84 point (swapped order: longitude, latitude): {latitude}° N, {longitude}° E"
pl1992_en = "PL-1992 point (order E, N): E {easting}, N {northing} — {latitude}° N, {longitude}° E"
pl1992_ne = "PL-1992 point (swapped order N, E): E {easting}, N {northing} — {latitude}° N, {longitude}° E"

[extractors.grid_cell]
cell = "PMAXTP grid cell {ind_x}/{ind_y} (ind_x/ind_y)"

# Readings of probability and duration (src/retman/extractors/probability.py, numbers.py,
# ARCHITECTURE 4.4). For a list of values (e.g. “for 1, 2 and 10”) the arguments contain all
# values: percent = "1%, 2%, 10" (the template appends the final “%”), years = "50, 20",
# value = "1, 2, 10"; the label then reads “p = 1%, 2%, 10%”.
[extractors.probability]
percent = "p = {percent}%"
return_period = "return period T = {years} years (p = {percent}%)"
fraction = "p = {value} (fraction)"

[extractors.duration]
minutes = "duration {minutes} min"

[extractors.variables.names]
H = "H — water level"
Q = "Q — discharge"
T = "T — water temperature"
H_min = "H_min — minimum water level"
H_mean = "H_mean — mean water level"
H_max = "H_max — maximum water level"
Q_min = "Q_min — minimum discharge"
Q_mean = "Q_mean — mean discharge"
Q_max = "Q_max — maximum discharge"
T_min = "T_min — minimum water temperature"
