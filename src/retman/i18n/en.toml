# Retman core texts in English (ARCHITECTURE 1.3, 4.2).
# Each section belongs to one module; the keys correspond to identifiers in the code.

[config]
missing_file = "Settings file {path} not found. Point to an existing file (--config or the NOGAT_CONFIG variable) or create it with the command: retman config init"
unreadable_file = "Cannot read settings file {path}: {error}"
invalid_toml = "Settings file {path} is not a valid TOML file: {error}"
invalid_section = "In settings file {path} the section is not a TOML table: {error}"
missing_key = "Decision model settings are missing: {keys}. Enter them in the [retman.decision] table of settings file {path} or set the RETMAN_DECISION_... variables; retman config init writes a template of the table"
invalid_value = "Invalid setting value: {keys} (file {path}, RETMAN_... variables); retman config show displays the values and their sources"
auto_threshold_without_basal = "The \"auto\" confidence thresholds work only with backend = \"basal\"; enter a number tuned for the model ({keys})"
already_exists = "Settings file {path} already has a [retman] table (not overwriting)"
backend_unavailable = "Backend \"{backend}\" is not yet available in this version of Retman; set backend = \"openai_compatible\" in [retman.decision] ({path})"
paths_overlap = "The store paths overlap: the Kartograf and IMGWTools stores are separate folders side by side (neither lies inside the other), and the cache file and the reference data folder lie outside the stores ({keys}; file {path})"

# Report of retman config show (retman/config_show.py).
[config_show]
title = "Retman {version} settings"
file = "Settings file: {path} ({source}; {state})"
file_source_default = "default location"
file_source_NOGAT_CONFIG = "from NOGAT_CONFIG"
file_source_option = "from --config"
file_exists = "exists"
file_missing = "does not exist"
file_error = "  File error: {error}"
ignored_unknown = "  Unknown key in the [retman] table: {name} (nothing uses it)"
ignored_credential = "  Key {name} in {path} is ignored: credentials are read only from environment variables, and the name of the model key variable is given by decision.api_key_env"
settings = "Settings (key = value, source):"
setting = "  {name} = {value}  [{source}]"
setting_error = "    Error: {error}"
unset = "(not set)"
source_default = "default"
source_env = "variable {name}"
source_file = "file, table {name}"
source_option = "option {name}"
credentials = "Credentials (environment variables; values are not shown):"
credential = "  {name}: {state}"
credential_present = "present"
credential_missing = "missing"
no_credentials = "  None: Retman does not read keys; the key of an external model provider is read from the variable named by decision.api_key_env."
stores = "Tool stores (their settings: [retman.tools.*]):"
store = "  {tool}: {root} ({state})"
store_exists = "exists, {size}"
store_missing = "does not exist yet"

