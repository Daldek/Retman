# Odczyty prawdopodobieństwa i czasu trwania (src/retman/extractors/probability.py, numbers.py,
# ARCHITECTURE 4.4). Dla listy wartości (np. „dla 1, 2 i 10”) argumenty zawierają wszystkie
# wartości: percent = "1%, 2%, 10" (szablon dopisuje końcowe „%”), years = "50, 20",
