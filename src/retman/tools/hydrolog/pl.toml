example = "CN 72"
help = "Liczbę CN odczytuje się z tablic TR-55 dla grupy glebowej i pokrycia terenu; dla warunków suchych albo wilgotnych Hydrolog przelicza ją sam."

[operations.compute_effective_rainfall.params.rainfall]
