model_question = "Jakie warunki wilgotności gleby przed opadem (AMC) wymienia polecenie?"
help = "Tablice CN są dla warunków przeciętnych (AMC II); po suszy CN maleje, po długich opadach rośnie."
options.dry.label = "Suche (AMC I)"
options.dry.description = "AMC I — suche warunki poprzedzające, susza, sucha gleba, mało opadów przed deszczem, CN obniżone"
options.normal.label = "Przeciętne (AMC II)"
options.normal.description = "AMC II — przeciętne, normalne warunki wilgotnościowe, standardowe CN z tablic"
options.wet.label = "Wilgotne (AMC III)"
options.wet.description = "AMC III — wilgotne warunki poprzedzające, mokra, nasycona gleba po wcześniejszych opadach, CN podwyższone"
options.unspecified.description = "Nie podano warunków wilgotnościowych — przyjmij przeciętne (AMC II)"

[operations.build_design_hyetograph]
label = "Hietogram opadu projektowego (Hydrolog)"
description = "Oblicz hietogram opadu projektowego (rozkład opadu w czasie, rozkład czasowy deszczu, hyetograph) o danej sumie w milimetrach, czasie trwania i kroku czasowym: blokowy (równomierny), trójkątny, rozkład Beta albo Euler typu II (DVWK); wynik to wysokości i natężenia opadu w kolejnych krokach."
summary = "Gotowe. Wynik #{number}: hietogram {hyetograph} — {total_mm} mm w {duration_min} min, {steps} kroków po {timestep_min} min, natężenie maksymalne {peak_intensity_mm_per_h} mm/h."

