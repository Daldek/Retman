[categories.rainfall_runoff]
label = "Opad i odpływ (Hydrolog)"
description = "Obliczenia hydrologiczne zlewni w Hydrologu: hietogram opadu projektowego (blokowy, trójkątny, Beta, Euler II), opad efektywny metodą SCS-CN z liczby CN i sumy opadu, czas koncentracji zlewni z pliku jej parametrów (Kirpich, NRCS, Giandotti, FAA, Kerby), projektowy hydrogram odpływu bezpośredniego zlewni o danej powierzchni, CN i czasie koncentracji; liczy lokalnie, bez internetu"

[categories.hydrology_analysis]
label = "Analizy zlewni i przepływów (Hydrolog)"
description = "Analizy w Hydrologu: przepływy maksymalne o danym prawdopodobieństwie (kwantyle wezbrań, rozkłady log-normalny, GEV, Pearson III, Weibull) z dobowego szeregu przepływów eksportowanego z Obserwatora oraz wskaźniki morfometryczne zlewni (kształt, deniwelacja, spadki) z pliku jej parametrów; liczy lokalnie, bez internetu"

[operations.compute_concentration_time]
label = "Czas koncentracji zlewni (Hydrolog)"
description = "Oblicz czas koncentracji (czas dobiegu, tc) zlewni wybraną metodą z pliku parametrów zlewni (JSON WatershedParameters, np. z Hydrografu albo z wyniku #N): wzór Kirpicha, NRCS (TR-55, czas opóźnienia, z CN), Giandottiego, FAA, Kerby'ego albo Kerby–Kirpich; wynik w minutach i godzinach."
summary = "Gotowe. Wynik #{number}: czas koncentracji metodą {method}: {tc_min} min ({tc_h} h)."

[operations.compute_concentration_time.params.method]
label = "Metoda czasu koncentracji"
question = "Którą metodą obliczyć czas koncentracji: Kirpicha, NRCS (TR-55), Giandottiego, FAA, Kerby'ego czy Kerby–Kirpich?"
model_question = "Jaką metodę obliczenia czasu koncentracji wymienia polecenie?"
help = "Metody dają wyniki różniące się nawet kilkukrotnie i potrzebują różnych pól zlewni: NRCS potrzebuje liczby CN, FAA współczynnika odpływu, a Kerby i Kerby–Kirpich szorstkości oraz długości i spadku spływu po stoku. Jeśli zlewni brakuje pól metody, zapytam o metodę ponownie."
options.kirpich.label = "Kirpich (długość i spadek cieku)"
options.kirpich.description = "kirpich — wzór Kirpicha, z długości i spadku cieku głównego, najczęstszy dla małych zlewni rolniczych"
options.nrcs.label = "NRCS / TR-55 (z liczby CN)"
options.nrcs.description = "nrcs — metoda NRCS (SCS, TR-55), czas opóźnienia (lag) z długości, spadku i liczby CN"
options.giandotti.label = "Giandotti (powierzchnia, długość, wysokości)"
options.giandotti.description = "giandotti — wzór Giandottiego z powierzchni zlewni, długości cieku i wysokości, dla większych zlewni"
options.faa.label = "FAA (spływ po stoku)"
options.faa.description = "faa — wzór FAA (Federal Aviation Administration) spływu powierzchniowego po stoku, ze współczynnikiem odpływu C"
options.kerby.label = "Kerby (spływ po stoku)"
options.kerby.description = "kerby — wzór Kerby'ego spływu po stoku ze współczynnikiem szorstkości (retardance)"
options.kerby_kirpich.label = "Kerby–Kirpich (stok i koryto)"
options.kerby_kirpich.description = "kerby_kirpich — metoda złożona: spływ po stoku wzorem Kerby'ego plus przepływ w korycie wzorem Kirpicha"
options.unspecified.description = "Nie podano metody obliczenia czasu koncentracji — dopytaj"

[operations.compute_effective_rainfall]
label = "Opad efektywny SCS-CN (Hydrolog)"
description = "Oblicz opad efektywny (odpływ powierzchniowy, opad netto, straty opadu) metodą SCS-CN z liczby CN (curve number) i sumy opadu w milimetrach, przy suchych, przeciętnych albo wilgotnych warunkach poprzedzających (AMC I, II, III); wynik to opad efektywny, retencja, straty początkowe i współczynnik odpływu."
summary = "Gotowe. Wynik #{number}: opad efektywny {effective_mm} mm z {precipitation_mm} mm opadu (CN {cn_adjusted}, AMC {amc}), współczynnik odpływu {runoff_coefficient}."

[operations.compute_effective_rainfall.params.cn]
label = "Liczba CN"
question = "Jaka jest liczba CN zlewni (od 1 do 100, dla przeciętnych warunków AMC II)?"
example = "CN 72"
help = "Liczbę CN odczytuje się z tablic TR-55 dla grupy glebowej i pokrycia terenu; dla warunków suchych albo wilgotnych Hydrolog przelicza ją sam."

[operations.compute_effective_rainfall.params.rainfall]
label = "Suma opadu"
question = "Jaka jest suma opadu w milimetrach?"
example = "50 mm"

[operations.compute_effective_rainfall.params.amc]
