[operations.compute_watershed_morphometry]
label = "Morfometria zlewni (Hydrolog)"
description = "Oblicz wskaźniki morfometryczne zlewni z pliku jej parametrów (JSON WatershedParameters, np. z Hydrografu albo z wyniku #N): powierzchnia, obwód, długość i szerokość, wskaźniki kształtu (Hortona, Graveliusa, Millera, Schumma), wysokości, deniwelacja i spadki; charakterystyka fizjograficzna zlewni."
summary = "Gotowe. Wynik #{number}: morfometria zlewni {name}: powierzchnia {area_km2} km², deniwelacja {relief_m} m, wskaźnik formy {form_factor}, współczynnik zwartości {compactness_coefficient}."

# Ostrzeżenia wyniku. Klucze równe kodom uwag Hydrologa mówią po polsku, czego dotyczy
# uwaga; jej angielski tekst (z liczbami) jest {text}. Pozostałe uwagi ostrzegawcze są
# pokazywane dosłownie (core: warnings.tool_notice), informacyjne zostają w pliku wyniku.
[warnings]
outside_typical_range = "Parametr poza typowym zakresem wzoru, wynik może być niewiarygodny: {text}"
duration_not_covered = "Czas trwania opadu nie jest wielokrotnością kroku czasowego: {text}"
incomplete_years = "Pominięto niepełne lata hydrologiczne (brak wartości dla części dni): {text}"
small_sample = "Krótka próba maksimów rocznych, oszacowania mogą być niepewne: {text}"
missing_values_removed = "Usunięto brakujące wartości szeregu: {text}"

# Błędy Hydrologa po kodzie rejestru błędów (ERR §4); jego własny tekst jest tylko
# {detail}, a details.reason mówi, który to błąd tego kodu
[errors]
validation_error = "Hydrolog odrzuca te wartości: {detail}"
not_found = "Hydrolog nie znalazł pliku wejściowego: {detail}"
data_error = "Plik wejściowy ma niepoprawny format albo brakuje w nim danych potrzebnych Hydrologowi: {detail}"
calculation_error = "Hydrolog nie mógł obliczyć wyniku z tych danych: {detail}"
forbidden = "Hydrolog nie zapisze pliku w tym miejscu: {detail}"
conflict = "Hydrolog nie nadpisze istniejącego pliku: {detail}"
missing_dependency = "Hydrologowi brakuje biblioteki potrzebnej do tej operacji: {detail}"
io_error = "Hydrolog nie może odczytać albo zapisać pliku: {detail}"
internal_error = "Wewnętrzny błąd Hydrologa: {detail}"

# Powody, dla których plan trzeba poprawić przed potwierdzeniem (podgląd bez sieci)
[problems]
method_fields = "Zlewnia z pliku nie ma pól, których potrzebuje metoda {method}: {missing}. Wybierz inną metodę albo uzupełnij plik zlewni."
tool_refused = "Hydrolog nie przyjmuje tej wartości: {detail}"
input_refused = "Hydrolog nie może policzyć wyniku z pliku wejściowego: {detail}"
step_exceeds_duration = "Krok czasowy ({time_step} min) jest dłuższy niż czas trwania opadu ({duration} min). Podaj krótszy krok albo dłuższy opad."

# Dodatkowe wiersze planu (podgląd bez sieci)
[preview.watershed]
label = "Zlewnia z pliku"
value = "{name}"

[preview.annual_maxima]
label = "Maksima roczne"
value = "{count} pełnych lat hydrologicznych ({first}–{last})"

[preview.incomplete_years]
label = "Pominięte lata"
value = "{count} niepełnych lat hydrologicznych: {years}"
