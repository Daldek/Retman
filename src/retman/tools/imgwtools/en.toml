options.cz_hydro_daily.description = "Czech hydrological data from ČHMÚ: water level, discharge, water temperature; Czech Republic; CHMI; CHMU; WIGOS; Czech stations"
options.cz_meteo_daily.label = "ČHMÚ daily meteorological data (Czech Republic)"
options.cz_meteo_daily.description = "Czech meteorological data from ČHMÚ: precipitation, mean, maximum and minimum temperature; Czech Republic; CHMI; CHMU; WIGOS; Czech stations"
options.unspecified.description = "The command does not specify the kind of data or the station network (precipitation, climate, hydrology, IMGW-PIB or ČHMÚ)"

[operations.show_station_coverage.params.station]
