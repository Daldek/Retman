pmaxtp_cell_missing = "The store has no saved PMAXTP cell {cell} (method {method}). Save it with the PMAXTP download operation that writes to the store."
series_missing = "The IMGW store has no series for dataset {dataset}. Choose the “server” source (it will download the archives and build the series) or build the series from the archives in the store."
station_not_in_series = "Station {station} is not in the series of dataset {dataset} in the store. Choose another station, another dataset or the “server” source."
