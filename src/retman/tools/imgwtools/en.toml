arch_plan_other_store = "The plan is for a different store ({plan_store}) than the configured one ({store}). Choose a plan checked for the current store."
arch_nothing_to_export = "The store has no archives of dataset {dataset} for the years {years}. Choose other years or another dataset, or download data to the store first."
