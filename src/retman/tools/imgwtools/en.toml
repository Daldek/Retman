[operations.add_imgw_project_task.params.stations]
label = "Stations"
question = "Which stations should be selected for the task? Give station names or codes."
example = "Poznań-Ławica"
help = "Give one or more stations (name or code: 9 digits for IMGW-PIB, WIGOS identifier for ČHMÚ)."

[operations.add_imgw_project_task.params.area_file]
label = "Area file (GeoJSON)"
question = "Which GeoJSON file defines the area in which the stations lie? The file must be in the project folder."
example = "zlewnia.geojson"
help = "GeoJSON in WGS84 (Polygon, MultiPolygon, Feature or FeatureCollection) in the project folder, without “..” and symbolic links. Requires the station catalog in the store (“Build the station catalog in the store”)."

[operations.add_imgw_project_task.params.period]
label = "Task years"
question = "Which years should the task cover? The task covers whole years, e.g. “2000–2020”."
example = "2000-2020"
help = "The task selects whole years (calendar or hydrological); it does not accept a period with dates (from day to day). Give a range of years, e.g. “2000–2020”."

[operations.add_imgw_project_task.params.year_type]
label = "Year type"
question = "Are the task years calendar years (1 January to 31 December) or hydrological years (1 November to 31 October)?"
help = "Hydrological year “2020” runs from 1 November 2019 to 31 October 2020. I always ask about this when the command does not say explicitly."
options.hydrological.label = "Hydrological years (1 Nov – 31 Oct)"
options.calendar.label = "Calendar years (1 Jan – 31 Dec)"

[operations.add_imgw_project_task.params.variables]
unset = "all dataset variables"
label = "Variables"
question = "Which variables should the task include (e.g. precipitation, flow, water level)?"
example = "flow and water level"
help = "Optionally narrow the task to selected dataset variables (e.g. Q, H, P); otherwise the task covers all variables of the dataset."

[operations.add_imgw_project_task.params.point]
label = "Point"
question = "For which point should the PMAXTP cell be saved? Give latitude and longitude (WGS84) or PL-1992 coordinates."
example = "52.23, 21.01"
help = "The point must lie within the PMAXTP data area (latitude 49–55° N, longitude 14–24.5° E)."

[operations.add_imgw_project_task.params.method]
label = "PMAXTP method"
question = "Which maximum precipitation method should be used: POT or AMP?"
model_question = "What maximum precipitation method does the command mention: POT (peaks over threshold) or AMP (annual maxima)?"
help = "POT uses threshold exceedances (partial series), AMP uses annual maxima."
options.pot.label = "POT (peaks over threshold)"
options.pot.description = "POT, peaks over threshold, threshold exceedances (przekroczenia progu), partial series (seria częściowa)"
options.amp.label = "AMP (annual maxima)"
options.amp.description = "AMP, annual maximum, annual maxima (maksima roczne), series of annual maxima (seria maksimów rocznych)"
options.unspecified.description = "The command does not specify a PMAXTP method"

[operations.download_imgw_project]
label = "Download and pin IMGW project data"
description = "Download the data for the tasks of an IMGW project into the store and record the pinned versions (SHA-256 checksums) in the manifest: either restore the pinned versions (new tasks will be downloaded and pinned for the first time) or update the data to the latest versions, changing the pins; download and pin project data; writes to the store and the manifest, requires network access."
summary = "Done. Result #{number}: IMGW project data downloaded — tasks pinned: {pinned_count} of {task_count}."

[operations.download_imgw_project.check]
notice = "I will query the IMGW-PIB or ČHMÚ servers (file lists and HEAD headers) about the project task data: what is newer or missing, and how much data that is. I download nothing."

[operations.download_imgw_project.params.update]
label = "Download mode"
question = "Should the pinned data versions be restored (new tasks will be downloaded and pinned for the first time), or should the data be updated to the latest versions and the pins changed?"
model_question = "Does the command ask to restore the data according to the pins, or to update it to the latest versions (change the pins)?"
help = "Restoring does not change the pins of tasks that are already pinned: missing files are downloaded again only if they have an identical SHA-256 checksum. Updating pins the tasks anew to the latest data versions."
options.pinned.label = "Restore pinned versions"
options.pinned.description = "restore, recover, according to pins, pinned versions, download missing, download and pin, first download, without changing pins"
options.upgrade.label = "Update data and change pins"
options.upgrade.description = "update, refresh, latest versions, newer data, re-pin, change pins, upgrade, project data update"
options.unspecified.description = "The command does not say whether to restore the pinned versions or update the data"

[operations.download_imgw_project.params.tasks]
unset = "all project tasks"
label = "Project tasks"
question = "Which project tasks does the operation apply to? Give their names."
example = "opady_poznan, przeplywy_warta"
help = "If no tasks are specified, the operation covers all tasks of the project."

[operations.check_imgw_project]
label = "Check whether IMGW project data is up to date"
description = "Check online whether the data of the IMGW project tasks is up to date: what is newer or missing on the servers, without downloading and without changing the store; saves the plan to a file; check the freshness of project data."
summary = "Done. Result #{number}: project data checked (tasks: {task_count}), files to download: {to_download} ({size_to_download}); the plan was saved in the result."

[operations.check_imgw_project.params.tasks]
unset = "all project tasks"
label = "Project tasks"
question = "Which project tasks should the check cover? Give their names."
example = "opady_poznan, przeplywy_warta"
help = "If no tasks are specified, I check all project tasks."

[operations.verify_imgw_project]
label = "Verify pinned IMGW project data"
description = "Verify the pinned data of the IMGW project offline: file status (existence and descriptions) or full SHA-256 checksums; whether the project data has not been changed or removed from the store; project checksum verification."
summary = "Done. Result #{number}: the project verification report was saved in the result (tasks: {task_count}, without issues: {tasks_ok}, with issues: {tasks_issues})."

[operations.verify_imgw_project.params.depth]
label = "Verification scope"
question = "Should I check only the file status (existence and descriptions), or the full SHA-256 checksums?"
model_question = "Does the command ask to check the status of the pinned files, or to verify the full SHA-256 checksums?"
help = "The file status check is quick; full verification computes the SHA-256 of every pinned file and may take a while."
options.status.label = "File status (quick)"
options.status.description = "status, stan, file existence, whether the files are there, quick check, without checksums"
options.verify.label = "Full SHA-256 checksums"
options.verify.description = "checksums, sumy kontrolne, SHA-256, SHA256, verify, verification, integrity, whether the data has not been changed, thorough check"
options.unspecified.description = "The command does not say whether to check the file status or the checksums"

[operations.verify_imgw_project.params.tasks]
unset = "all project tasks"
label = "Project tasks"
question = "Which project tasks should the verification cover? Give their names."
example = "opady_poznan, przeplywy_warta"
help = "If no tasks are specified, I verify all project tasks."

[operations.remove_imgw_project_task]
label = "Remove a task from an IMGW data project"
description = "Remove a task from an IMGW data project (from the imgw-project.json manifest); data versions in the store are left untouched; remove a task, delete a task from the project."
summary = "Done. Result #{number}: removed task “{task}” from the IMGW project (tasks in the manifest: {task_count})."

[operations.remove_imgw_project_task.params.task_name]
label = "Task name"
question = "Which task should be removed from the project? Give its name."
example = "opady_poznan"
help = "Give the task name exactly as it appears in the project."

[operations.set_imgw_project_store]
label = "Set the current IMGW store for a project"
description = "Set the IMGW project's store from the configuration: change the project's store after verifying the pinned files in the new store (SHA-256 checksums); move the project to another store, set the project's store."
summary = "Done. Result #{number}: the IMGW project now points to store {store}."

