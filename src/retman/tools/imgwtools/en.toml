arch_not_published = "The server does not publish {count} of {total} requested files; the rest were downloaded."
arch_export_partial = "The store has only {found} of {total} archive files for the selected dataset and years; the rest were not exported."

# Plan problems detected offline: with parameters — the question is asked again, without — the plan will fail.
