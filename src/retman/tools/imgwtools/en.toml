validation_error = "IMGWTools rejects this choice: {detail}"
not_found = "IMGWTools did not find the data: {detail}"
conflict = "IMGWTools reports a conflict: {detail}"
forbidden = "IMGWTools refuses to write there: {detail}"
source_unavailable = "The data server is unavailable: {detail}. Try again later."
missing_dependency = "An IMGWTools add-on is missing: {detail}. Check: retman doctor check"
data_error = "The IMGWTools data is invalid or incomplete: {detail}"
store_unavailable = "The IMGW store is unavailable: {detail}. Check: retman doctor check"
unsupported = "IMGWTools does not support this: {detail}"
io_error = "File write or read error: {detail}"
cancelled = "The operation was cancelled: {detail}"
internal_error = "IMGWTools internal error: {detail}"
store_write_unsupported = "This disk does not allow IMGWTools to write to the store ({detail}). The store must be on a file system that supports hard links. Check: retman doctor check"
