[categories.imgw_catalog]
label = "IMGW stations and data register"
description = "Finding IMGW-PIB and ČHMÚ hydrological and meteorological stations by name, river or code, building the station catalog in the store, list of available datasets and providers"

[categories.imgw_current]
label = "IMGW current data and warnings"
description = "Current measurements from the IMGW-PIB server: water level and flow, meteorological and synoptic data, hydrological and meteorological warnings, station alarm and warning levels"

[categories.imgw_pmaxtp]
label = "PMAXTP maximum precipitation"
description = "Probable maximum precipitation PMAXTP (precipitation quantiles for a duration and probability) for a point with given coordinates or for a stored grid cell"

[categories.imgw_series]
label = "IMGW and ČHMÚ station time series"
description = "Daily and monthly series of IMGW-PIB and ČHMÚ stations: precipitation, flows, water levels, temperatures; export to CSV, station data coverage, building series in the store"

[categories.imgw_archives]
label = "IMGW archives and data store"
description = "IMGW-PIB and ČHMÚ data archives: downloading archive files, checking and synchronising the local store, exporting stored archives, initialising and inspecting the store"

[categories.imgw_projects]
label = "IMGW data projects"
description = "IMGW data projects: task manifest in the project folder, adding and removing tasks, downloading and pinning data versions, checking whether data is up to date and checksums"

[operations.find_imgw_stations]
label = "Find IMGW and ČHMÚ stations"
description = "Find IMGW-PIB and ČHMÚ hydrological or meteorological stations (stacje) by name, river, kind or provider: station codes, names, rivers, coordinates; water gauges (wodowskazy), precipitation, climate and synoptic stations; from the server or from the station catalog in the store."
summary = "Done. Result #{number}: the list of stations ({count}) saved in a CSV file."

[operations.find_imgw_stations.params.data_source]
label = "Station list source"
question = "Where should the station list come from: the IMGW server (network) or the catalog in the local store (no network)?"
model_question = "Does the command say where to take the station list from: the server or the local store?"
help = "The server returns current station lists and requires internet access. The catalog in the store works without a network, but it must be built first (“Build the IMGW station catalog”)."
options.server.label = "From the server (network)"
options.server.description = "from the IMGW server, current station list, from the internet, online, download the list"
options.store.label = "From the catalog in the store (no network)"
options.store.description = "from the store, from the station catalog, locally, offline, without internet, already built catalog"
options.unspecified.description = "The command does not say where to take the station list from"

[operations.find_imgw_stations.params.provider]
unset = "both providers (IMGW-PIB and ČHMÚ)"
label = "Data provider"
question = "Stations of which provider: IMGW-PIB (Poland) or ČHMÚ (Czechia)?"
model_question = "Does the command limit stations to one provider: IMGW-PIB (Poland) or ČHMÚ (Czechia)?"
options.imgw_pib.label = "IMGW-PIB (Poland)"
options.imgw_pib.description = "IMGW, IMGW-PIB, Polish stations, Poland, Instytut Meteorologii i Gospodarki Wodnej"
options.chmi.label = "ČHMÚ (Czechia)"
options.chmi.description = "ČHMÚ, CHMU, CHMI, Czech stations, Czechia, Český hydrometeorologický ústav"
options.unspecified.description = "The command does not limit stations to one provider"

[operations.find_imgw_stations.params.kind]
unset = "all kinds (hydrological and meteorological)"
label = "Station kind"
question = "Which stations: hydrological (water gauges) or meteorological?"
model_question = "Does the command limit stations to hydrological or meteorological ones?"
options.hydro.label = "Hydrological"
options.hydro.description = "hydrological, hydro, water gauges (wodowskazy), water gauge posts (posterunki wodowskazowe), water level, flow, rivers"
options.meteo.label = "Meteorological"
options.meteo.description = "meteorological, meteo, precipitation, climate, synoptic, weather, rain gauges (deszczomierze)"
options.unspecified.description = "The command does not limit the station kind"

[operations.find_imgw_stations.params.query]
unset = "no name filter (all stations)"
label = "Name or river"
question = "What station name or river should be searched for?"
example = "Wisła"
help = "Give part of a station name, a town or a river (e.g. “Poznań”, “na Wiśle”); letter case and Polish diacritics do not matter."

[operations.build_imgw_station_catalog]
label = "Build the station catalog in the store"
description = "Build or refresh the catalog of IMGW-PIB or ČHMÚ stations in the local IMGW store (stations.geojson): lists of stations with coordinates, needed to find stations by name without the internet; writes to the store, requires network access."
summary = "Done. Result #{number}: {provider} station catalog in the store ({station_count} stations, without location: {without_location}, status: {status})."

[operations.build_imgw_station_catalog.check]
notice = "I will ask the IMGW-PIB or ČHMÚ servers (station lists) whether the catalog in the store is up to date."

[operations.build_imgw_station_catalog.params.provider]
label = "Data provider"
question = "Which provider's station catalog should be built: IMGW-PIB or ČHMÚ?"
model_question = "Which provider's station catalog should the command build: IMGW-PIB (Poland) or ČHMÚ (Czechia)?"
help = "The catalog is separate for each provider; for Czech data, build the ČHMÚ catalog."
options.imgw_pib.label = "IMGW-PIB (Poland)"
options.imgw_pib.description = "IMGW, IMGW-PIB, Polish stations, Poland, Instytut Meteorologii i Gospodarki Wodnej (Institute of Meteorology and Water Management)"
options.chmi.label = "ČHMÚ (Czechia)"
options.chmi.description = "ČHMÚ, CHMU, CHMI, Czech stations, Czechia, Český hydrometeorologický ústav"
options.unspecified.description = "The command does not specify the provider of the station catalog"

[operations.build_imgw_station_catalog.params.user_locations]
unset = "none (only locations from IMGW lists and from series in the store)"
label = "File with station locations"
question = "Which CSV file with station locations should be added to the catalog?"
example = "polozenia_stacji.csv"
help = "An optional CSV file with the columns station_code, latitude and longitude (optionally source) supplies coordinates for stations that are not in the IMGW lists."

[operations.list_imgw_datasets]
label = "List of IMGW and ČHMÚ datasets"
description = "Show which datasets and providers IMGWTools supports: daily, monthly and half-yearly hydrological and meteorological data, year range, variables, licences, and which datasets are in the store; works offline."
summary = "Done. Result #{number}: datasets: {datasets}, providers: {providers}."

[operations.list_imgw_datasets.params.provider]
unset = "both providers (IMGW-PIB and ČHMÚ)"
label = "Data provider"
question = "Datasets from which provider should be shown: IMGW-PIB or ČHMÚ?"
model_question = "Does the command limit the list of datasets to one provider: IMGW-PIB (Poland) or ČHMÚ (Czechia)?"
options.imgw_pib.label = "IMGW-PIB (Poland)"
options.imgw_pib.description = "IMGW, IMGW-PIB, Polish stations, Poland, Instytut Meteorologii i Gospodarki Wodnej (Institute of Meteorology and Water Management)"
options.chmi.label = "ČHMÚ (Czechia)"
options.chmi.description = "ČHMÚ, CHMU, CHMI, Czech stations, Czechia, Český hydrometeorologický ústav (Czech Hydrometeorological Institute)"
options.unspecified.description = "The command does not limit the list to one provider"

[operations.list_imgw_datasets.params.kind]
unset = "all kinds (hydrological and meteorological)"
label = "Kind of datasets"
question = "Which datasets should be shown: hydrological or meteorological?"
model_question = "Does the command limit the list of datasets to hydrological or meteorological ones?"
options.hydro.label = "Hydrological"
options.hydro.description = "hydrological, hydro, water level, flow, gauging stations (wodowskazy)"
options.meteo.label = "Meteorological"
options.meteo.description = "meteorological, meteo, precipitation, temperature, climate, synoptic"
options.unspecified.description = "The command does not limit the kind of datasets"

[operations.fetch_current_observations]
label = "Current station measurements"
description = "Download current measurement data from the IMGW-PIB server: current water level, discharge and water temperature from hydrological stations, meteorological or synoptic data (air temperature, wind, humidity, precipitation, pressure), for all stations or a single one."
summary = "Done. Result #{number}: current station data, rows: {rows} (fetched {fetched_at})."

[operations.fetch_current_observations.params.source]
label = "Type of current data"
question = "Which current data should be downloaded: hydrological, meteorological or synoptic?"
model_question = "What type of current data does the command mention: hydrological (water level, discharge), meteorological or synoptic?"
help = "Hydrological data is water level, discharge and water temperature from gauging stations; meteorological data comes from automatic stations; synoptic data comes from synoptic stations."
options.hydro.label = "Hydrological (water level, discharge)"
options.hydro.description = "hydrological, water level, water stage, discharge, flow, water temperature, wodowskaz (gauge), river, ice phenomena"
options.meteo.label = "Meteorological (automatic stations)"
options.meteo.description = "meteorological, air temperature, wind, humidity, 10-minute precipitation, automatic stations"
options.synop.label = "Synoptic"
options.synop.description = "synoptic, synop, synoptic stations, temperature, pressure, visibility, cloud cover, weather"
options.unspecified.description = "The command does not say which current data it concerns"

[operations.fetch_current_observations.params.station]
unset = "all stations"
label = "Station"
question = "From the station with which name or code should the data be downloaded?"
example = "Poznań-Bogdanka"
help = "Give the station name (e.g. “Poznań-Bogdanka”) or the 9-digit IMGW-PIB code. Without a station I will download data for all stations."

[operations.fetch_current_observations.params.synop_station]
unset = "all synoptic stations"
label = "Synoptic station"
question = "Which synoptic station should be selected (name or 5-digit code)?"
example = "Warszawa"
help = "Give part of the synoptic station name or its 5-digit code (e.g. code 12375). Without a station I will download data for all synoptic stations."

[operations.fetch_imgw_warnings]
label = "Hydrological and meteorological warnings"
description = "Download current IMGW-PIB warnings: hydrological (rising water, exceeded warning and alarm levels, hydrological drought) and meteorological (strong wind, storms, heavy rain, frost), with the danger level, area and period of validity."
summary = "Done. Result #{number}: warnings in force: {rows}."

[operations.fetch_imgw_warnings.params.kind]
unset = "all (hydrological and meteorological)"
label = "Warning type"
question = "Which warnings should be downloaded: hydrological or meteorological?"
model_question = "Does the command limit the warnings to hydrological or meteorological ones?"
options.hydro.label = "Hydrological"
options.hydro.description = "hydrological, hydro, rising water (wezbranie), flood (powódź), warning levels (stany ostrzegawcze), hydrological drought (susza hydrologiczna), rivers"
options.meteo.label = "Meteorological"
options.meteo.description = "meteorological, meteo, weather, wind, storms, downpours (ulewy), snow, frost, heat (upał)"
options.unspecified.description = "The command does not limit the type of warnings"

[operations.fetch_hydro_states]
label = "Water levels at stations (alarm and warning)"
description = "Download the water level at IMGW-PIB hydrological stations relative to warning and alarm levels: which stations are at alarm, warning, high or normal level; all stations or only the main ones; with station coordinates."
summary = "Done. Result #{number}: station water levels: {rows}."

[operations.fetch_hydro_states.params.main_only]
label = "Main stations only"
question = "Download only the main hydrological stations?"
model_question = "Does the command say it concerns only the main hydrological stations?"
help = "Main stations are selected, most important water gauges. Without this restriction the list covers all hydrological stations."

[operations.get_pmaxtp]
label = "PMAXTP maximum precipitation for a point"
description = "Download probable maximum precipitation PMAXTP from the IMGW server for a point with the given coordinates: a table of precipitation quantiles for durations from 5 to 180 minutes and exceedance probabilities, POT or AMP method, with the option of saving the grid cell in the store."
summary = "Done. Result #{number}: PMAXTP table (method {method}) for point {latitude}°N, {longitude}°E, rows: {rows}."

[operations.get_pmaxtp.params.point]
label = "Point"
question = "For which point (coordinates) should maximum precipitation be downloaded?"
example = "52.23, 21.01"
help = "Give coordinates in WGS84 (latitude and longitude, e.g. 52.23 21.01) or in PL-1992. PMAXTP covers the area of Poland: latitude 49–55°, longitude 14–24.5°."

[operations.get_pmaxtp.params.method]
label = "Calculation method"
question = "Which method should be used to download PMAXTP: POT or AMP?"
model_question = "Which PMAXTP calculation method does the command mention: POT or AMP?"
help = "POT is the peaks-over-threshold method, AMP the annual maxima method; the results of the two methods differ."
options.pot.label = "POT (peaks over threshold)"
options.pot.description = "POT, peaks over threshold, threshold method (metoda ponadprogowa), maxima exceeding a threshold"
options.amp.label = "AMP (annual maxima)"
options.amp.description = "AMP, annual maximum precipitation, annual maxima method (metoda maksimów rocznych), yearly maxima"
options.unspecified.description = "The command does not specify POT or AMP"

[operations.get_pmaxtp.params.storage]
label = "Saving in the store"
question = "Should the PMAXTP cell also be saved in the IMGW store, or only in the result file?"
model_question = "Does the command tell it to save PMAXTP data in the store, or say the result should be only in a file?"
help = "Saving in the store keeps the grid cell for later offline reading; the result file alone leaves nothing in the store."
options.none.label = "Result file only"
options.none.description = "result file only, no saving to the store, one-off, without a store"
options.store.label = "Also save in the store"
options.store.description = "save in the store, remember the cell, keep in the store, for later, for offline reading"
options.unspecified.description = "The command says nothing about saving to the store"

[operations.get_pmaxtp.params.probability]
unset = "all probabilities from the PMAXTP table"
label = "Probability"
question = "For which exceedance probability should the table be narrowed (e.g. 1%, 2%, 10%)?"
example = "1%"
help = "Optional result filter: the PMAXTP table contains several probabilities; give the ones you are interested in (e.g. 1% and 10%)."

[operations.get_pmaxtp.params.duration]
unset = "all durations from the PMAXTP table"
label = "Rainfall duration"
question = "For which rainfall duration should the table be narrowed (e.g. 15 min, 1 h)?"
example = "15 min"
help = "Optional result filter: PMAXTP gives precipitation for durations from 5 to 180 minutes; give the ones you are interested in."

[operations.read_stored_pmaxtp]
label = "Read a stored PMAXTP cell"
description = "Read from the local IMGW store a previously saved PMAXTP grid cell (indices ind_x and ind_y, e.g. 751/317) without internet: the table of maximum probable precipitation for that cell."
summary = "Done. Result #{number}: PMAXTP table of cell {cell[ind_x]}/{cell[ind_y]} (method {method}), rows: {rows}."

[operations.read_stored_pmaxtp.params.cell]
label = "PMAXTP grid cell"
question = "Which PMAXTP grid cell should be read (ind_x/ind_y)?"
example = "751/317"
help = "Give the cell indices, e.g. 751/317 or “ind_x 751 ind_y 317”. You know the indices from the result of an earlier PMAXTP download saved to the store."

[operations.read_stored_pmaxtp.params.method]
label = "Calculation method"
question = "Which method should the cell be read for: POT or AMP?"
model_question = "Which PMAXTP calculation method does the command mention: POT or AMP?"
help = "In the store the cell is saved separately for each method."
options.pot.label = "POT (peaks over threshold)"
options.pot.description = "POT, peaks over threshold, threshold method (ponadprogowa), maxima exceeding a threshold"
options.amp.label = "AMP (annual maxima)"
options.amp.description = "AMP, annual maximum precipitation, annual maxima method, yearly maxima"
options.unspecified.description = "The command specifies neither POT nor AMP method"

[operations.export_station_series]
label = "Export a station series to CSV"
description = "Download or export the time series of a single station to CSV (szereg czasowy): daily precipitation, flows, water levels, temperature; IMGW-PIB, IMGW, ČHMÚ, Czech Republic; from the server via the store or from the local store."
summary = "Done. Result #{number}: series of station {station_code} ({rows} rows, {first_date} – {last_date}) saved in a CSV file."

[operations.export_station_series.check]
notice = "I will ask the IMGW server which archives need to be downloaded to the store for this station and period (HEAD requests, without downloading the files)."

[operations.export_station_series.params.dataset]
label = "Dataset"
question = "Which dataset should the series be exported from?"
model_question = "What kind of data and from which station network does the command mention?"
help = "The IMGW station list does not say whether a station is a precipitation or a climate station; specify the dataset and I will match the station to it. ČHMÚ hydrological and meteorological data cover the Czech Republic."
options.pl_hydro_daily.label = "IMGW-PIB daily hydrological data"
options.pl_hydro_daily.description = "daily hydrological data: water level, flow, water temperature; water gauge (wodowskaz); IMGW-PIB hydrological stations; rivers; daily"
options.pl_hydro_monthly.label = "IMGW-PIB monthly hydrological data"
options.pl_hydro_monthly.description = "monthly hydrological data: minimum, mean and maximum water level, flow and water temperature in a month; IMGW-PIB hydrological stations; monthly extremes"
options.pl_hydro_semiannual.label = "IMGW-PIB half-year and annual hydrological data"
options.pl_hydro_semiannual.description = "half-year and annual hydrological data: extremes of water level, flow and water temperature in the winter half-year, summer half-year and the year; IMGW-PIB hydrological stations"
options.pl_meteo_climate_daily.label = "IMGW-PIB daily climate data"
options.pl_meteo_climate_daily.description = "daily climate data: maximum, minimum, mean and ground-level air temperature, daily precipitation, snow cover; IMGW-PIB climate stations"
options.pl_meteo_precip_daily.label = "Daily precipitation from IMGW-PIB precipitation stations"
options.pl_meteo_precip_daily.description = "daily precipitation, daily precipitation total, snow cover, fresh snow from IMGW-PIB precipitation stations; rain gauge (deszczomierz); daily precipitation"
options.cz_hydro_daily.label = "ČHMÚ daily hydrological data (Czech Republic)"
options.cz_hydro_daily.description = "Czech hydrological data from ČHMÚ: water level, flow, water temperature; Czech Republic; CHMI; CHMU; WIGOS; Czech stations"
options.cz_meteo_daily.label = "ČHMÚ daily meteorological data (Czech Republic)"
options.cz_meteo_daily.description = "Czech meteorological data from ČHMÚ: precipitation, mean, maximum and minimum temperature; Czech Republic; CHMI; CHMU; WIGOS; Czech stations"
options.unspecified.description = "The command specifies neither the kind of data nor the station network (precipitation, climate, hydrology, IMGW-PIB or ČHMÚ)"

[operations.export_station_series.params.station]
label = "Station"
question = "For which station (name or code) should the series be exported?"
example = "Poznań-Ławica"
help = "Give the station name, town or river, or a code: 9 digits (IMGW-PIB) or a WIGOS identifier (ČHMÚ). I match names against the station catalog in the store; if there is none, give the code."

[operations.export_station_series.params.period]
label = "Period"
question = "What period of data should be exported (years or from–to dates)?"
example = "2000–2020"
help = "Give years (e.g. 2000–2020, “from the years 2010-2015”, year 2015) or dates (e.g. from 1.01.2000 to 31.12.2005). Whether the years are calendar or hydrological years is determined separately."

[operations.export_station_series.params.year_type]
label = "Year type"
question = "Are the given years calendar years (1 Jan – 31 Dec) or hydrological years (1 Nov – 31 Oct)?"
help = "The hydrological year runs from 1 November of the previous year to 31 October and is named after the year in which it ends (hydrological year 2020 is 1.11.2019 – 31.10.2020). The year type determines the date range and the year numbering in the file."
options.hydrological.label = "Hydrological (1 Nov – 31 Oct)"
options.calendar.label = "Calendar (1 Jan – 31 Dec)"

[operations.export_station_series.params.data_source]
label = "Data source"
question = "Download the data from the IMGW server (network, tops up the store) or use the local store (no network)?"
model_question = "Does the command say where to get the data from: the server or the local store?"
help = "From the server: I will download the missing archives from the network into the store and build the series (the archives cover the whole country). From the store: I will use the series already there, without the internet."
options.server.label = "From the server (network, tops up the store)"
options.server.description = "download from the server, fetch, update the data, current data from the internet, top up the store"
options.store.label = "From the local store (no network)"
options.store.description = "from the store, locally, offline, already downloaded data, without the internet"
options.unspecified.description = "The command does not specify the data source"

[operations.export_station_series.params.variables]
unset = "all variables of the dataset"
label = "Variables"
question = "Which variables (e.g. precipitation, discharge, water level) should be exported?"
example = "discharge and water level"
help = "Optionally narrow the file to selected variables of the dataset (e.g. Q, H, P); without this I export all variables of the dataset."

[operations.show_station_coverage]
label = "Station data coverage in the store"
description = "Show which years and variables the IMGW store has station data (series) for: first and last day, number of measurements, gaps in the data; for one station, several or all stations of the dataset; without the internet."
summary = "Done. Result #{number}: data coverage: {stations} stations, from {first} to {last}, gaps: {gaps_total}."

