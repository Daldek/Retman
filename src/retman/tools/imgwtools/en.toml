[operations.download_hydro_archives]
label = "Download hydrological archives to the result folder"
description = "Download archive files of IMGW-PIB or ČHMÚ hydrological data to the result folder, without processing and without saving to the store: daily, monthly and half-yearly hydrological data (water level, discharge, water temperature), ice phenomena and river overgrowth; ZIP archives from the server, raw source data, packages by year."
summary = "Done. Result #{number}: archives downloaded — files: {files} ({size}); the files are in the result folder."

[operations.download_hydro_archives.params.dataset]
label = "Dataset"
question = "Archives of which hydrological dataset should be downloaded?"
model_question = "What kind of hydrological data (daily, monthly, half-yearly, ice phenomena, Czechia) does the command mention?"
help = "IMGW-PIB hydrological data is daily, monthly, or half-yearly and annual; ice phenomena and river overgrowth form a separate dataset. Czech data is the ČHMÚ dataset."
options.pl_hydro_daily.label = "IMGW-PIB daily hydrological data"
options.pl_hydro_daily.description = "daily hydrological data: water level, discharge, water temperature; gauge (wodowskaz); IMGW-PIB hydrological stations; rivers; everyday; hydro daily (hydro dobowe)"
options.pl_hydro_monthly.label = "IMGW-PIB monthly hydrological data"
options.pl_hydro_monthly.description = "monthly hydrological data: minimum, mean and maximum water level, discharge and water temperature in a month; IMGW-PIB hydrological stations; hydro monthly (hydro miesięczne)"
options.pl_hydro_semiannual.label = "IMGW-PIB half-yearly and annual hydrological data"
options.pl_hydro_semiannual.description = "half-yearly and annual hydrological data: extremes of water level, discharge and water temperature in the winter half-year, summer half-year and the year; IMGW-PIB hydrological stations"
options.pl_hydro_phenomena.label = "IMGW-PIB ice phenomena and river overgrowth"
options.pl_hydro_phenomena.description = "ice phenomena and river overgrowth: ice, frazil ice (śryż), ice cover, ice jam (zator), channel overgrowth; IMGW-PIB hydrological phenomena"
options.cz_hydro_daily.label = "ČHMÚ daily hydrological data (Czechia)"
options.cz_hydro_daily.description = "Czech hydrological data from ČHMÚ: water level, discharge, water temperature; Czechia; CHMI; CHMU; WIGOS; Czech stations"
options.unspecified.description = "The command does not indicate which hydrological data the archives concern"

[operations.download_hydro_archives.params.years]
label = "Archive years"
question = "Which years should the archives be downloaded for (e.g. “2000–2020”)?"
example = "2000-2020"
help = "Years are numbered by IMGW: the IMGW-PIB hydrological data archive uses the hydrological year (from 1 November of the previous year to 31 October), ČHMÚ data the calendar year. Give a range (“2000–2020”) or a list (“2010, 2012 and 2015”)."

[operations.download_hydro_archives.params.hydro_params]
label = "Half-yearly data parameters"
question = "Which parameters should be downloaded: water level (H), discharge (Q), water temperature (T) or all?"
model_question = "Which hydrological parameter does the command mention: water level, discharge, water temperature, or all?"
help = "IMGW-PIB half-yearly and annual data is in separate files for each parameter."
options.h.label = "Water level (H)"
options.h.description = "water level, water stage, H, gauge (wodowskaz), cm"
options.q.label = "Discharge (Q)"
options.q.description = "discharge, flow rate, Q, cubic metres per second"
options.t.label = "Water temperature (T)"
options.t.description = "water temperature, T, degrees Celsius"
options.all.label = "All (H, Q, T)"
options.all.description = "all parameters, complete set, water level, discharge and water temperature"
options.unspecified.description = "The command does not indicate the parameters of half-yearly data"

[operations.download_hydro_archives.params.stations]
label = "ČHMÚ stations"
question = "Which ČHMÚ stations should the files be downloaded for? Give station codes (WIGOS identifiers) or station names."
example = "0-203-1-001000"
help = "ČHMÚ files are separate for each station, so stations are required. A WIGOS code has the form “0-203-1-001000”."

[operations.download_meteo_archives]
label = "Download meteorological archives to the result folder"
description = "Download archive files of IMGW-PIB or ČHMÚ meteorological data to the result folder, without processing and without saving to the store: daily climate and precipitation data, monthly climate, precipitation and synoptic data, term data; climate, precipitation and synoptic stations; ZIP archives from the server, raw source data."
