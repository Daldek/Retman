[categories.imgw_catalog]
label = "Stacje i rejestr danych IMGW"
description = "Wyszukiwanie stacji hydrologicznych i meteorologicznych IMGW-PIB i ČHMÚ po nazwie, rzece lub kodzie, budowa katalogu stacji w magazynie, lista dostępnych zbiorów danych i dostawców"

[categories.imgw_current]
label = "Dane bieżące i ostrzeżenia IMGW"
description = "Aktualne pomiary z serwera IMGW-PIB: stan wody i przepływ, dane meteorologiczne i synoptyczne, ostrzeżenia hydrologiczne i meteorologiczne, stany alarmowe i ostrzegawcze stacji"

[categories.imgw_pmaxtp]
label = "Opady maksymalne PMAXTP"
description = "Opady maksymalne prawdopodobne PMAXTP (kwantyle opadu dla czasu trwania i prawdopodobieństwa) dla punktu o podanych współrzędnych albo dla zapisanej komórki siatki"

[categories.imgw_series]
label = "Szeregi czasowe stacji IMGW i ČHMÚ"
description = "Szeregi dobowe i miesięczne stacji IMGW-PIB i ČHMÚ: opady, przepływy, stany wody, temperatury; eksport do CSV, pokrycie danych stacji, budowa szeregów w magazynie"

[categories.imgw_archives]
label = "Archiwa i magazyn danych IMGW"
description = "Archiwa danych IMGW-PIB i ČHMÚ: pobieranie plików archiwalnych, sprawdzanie i synchronizacja lokalnego magazynu, eksport zapisanych archiwów, inicjalizacja i podgląd magazynu"

[categories.imgw_projects]
label = "Projekty danych IMGW"
description = "Projekty danych IMGW: manifest zadań w folderze projektu, dodawanie i usuwanie zadań, pobieranie i przypinanie wersji danych, sprawdzanie aktualności i sum kontrolnych"

[operations.find_imgw_stations]
label = "Wyszukanie stacji IMGW i ČHMÚ"
description = "Znajdź stacje hydrologiczne albo meteorologiczne IMGW-PIB i ČHMÚ po nazwie, rzece, rodzaju lub dostawcy: kody stacji, nazwy, rzeki, współrzędne; wodowskazy, stacje opadowe, klimatyczne i synoptyczne; z serwera albo z katalogu stacji w magazynie."
summary = "Gotowe. Wynik #{number}: lista stacji ({count}) zapisana w pliku CSV."

[operations.find_imgw_stations.params.data_source]
label = "Źródło listy stacji"
question = "Skąd wziąć listę stacji: z serwera IMGW (sieć) czy z katalogu w lokalnym magazynie (bez sieci)?"
model_question = "Czy polecenie mówi, skąd wziąć listę stacji: z serwera czy z lokalnego magazynu?"
help = "Serwer zwraca aktualne listy stacji i wymaga internetu. Katalog w magazynie działa bez sieci, ale trzeba go wcześniej zbudować („Zbuduj katalog stacji IMGW”)."
options.server.label = "Z serwera (sieć)"
options.server.description = "z serwera IMGW, aktualna lista stacji, z internetu, online, pobierz listę"
options.store.label = "Z katalogu w magazynie (bez sieci)"
options.store.description = "z magazynu, z katalogu stacji, lokalnie, offline, bez internetu, już zbudowany katalog"
options.unspecified.description = "Polecenie nie mówi, skąd wziąć listę stacji"

