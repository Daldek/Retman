description = "Pobierz do lokalnego magazynu IMGW nowe i brakujące archiwa wybranego zbioru i lat, a potem zbuduj szeregi czasowe: aktualizacja magazynu, synchronizacja, uzupełnienie lokalnych danych, ściągnięcie opadów, przepływów albo stanów wody do magazynu; zapisuje w magazynie, wymaga sieci."
summary = "Gotowe. Wynik #{number}: magazyn IMGW zaktualizowany — nowych wersji archiwów: {new_versions}, szeregów zbudowanych: {new_series}."

[operations.sync_imgw_store.check]
notice = "Zapytam serwery IMGW-PIB albo ČHMÚ (listy plików i nagłówki HEAD) o archiwa z planu: ile jest nowszych albo brakujących i ile to danych."

[operations.sync_imgw_store.params.dataset]
label = "Zbiór danych"
question = "Archiwa którego zbioru danych pobrać do magazynu?"
model_question = "Jakiego rodzaju dane i z jakiej sieci stacji dotyczy polecenie?"
help = "Magazyn przechowuje zbiory, z których IMGWTools buduje szeregi czasowe: hydrologiczne dobowe, miesięczne i półroczne, klimatyczne i opadowe dobowe oraz dane czeskie ČHMÚ."
options.pl_hydro_daily.label = "Dane hydrologiczne dobowe IMGW-PIB"
options.pl_hydro_daily.description = "dobowe dane hydrologiczne: stan wody, przepływ, temperatura wody; wodowskaz; stacje hydrologiczne IMGW-PIB; rzeki; codzienne; hydro dobowe"
options.pl_hydro_monthly.label = "Dane hydrologiczne miesięczne IMGW-PIB"
options.pl_hydro_monthly.description = "miesięczne dane hydrologiczne: minimalny, średni i maksymalny stan wody, przepływ i temperatura wody w miesiącu; stacje hydrologiczne IMGW-PIB; hydro miesięczne"
options.pl_hydro_semiannual.label = "Dane hydrologiczne półroczne i roczne IMGW-PIB"
options.pl_hydro_semiannual.description = "półroczne i roczne dane hydrologiczne: ekstrema stanu wody, przepływu i temperatury wody w półroczu zimowym, letnim i w roku; stacje hydrologiczne IMGW-PIB"
options.pl_meteo_climate_daily.label = "Dane klimatyczne dobowe IMGW-PIB"
options.pl_meteo_climate_daily.description = "dobowe dane klimatyczne: temperatura powietrza maksymalna, minimalna, średnia, przygruntowa, opad dobowy, pokrywa śnieżna; stacje klimatyczne IMGW-PIB"
options.pl_meteo_precip_daily.label = "Opady dobowe ze stacji opadowych IMGW-PIB"
options.pl_meteo_precip_daily.description = "dobowe opady, suma dobowa opadu, pokrywa śnieżna, świeży śnieg ze stacji opadowych IMGW-PIB; deszczomierz; opad dobowy"
options.cz_hydro_daily.label = "Dane hydrologiczne dobowe ČHMÚ (Czechy)"
options.cz_hydro_daily.description = "czeskie dane hydrologiczne ČHMÚ: stan wody, przepływ, temperatura wody; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.cz_meteo_daily.label = "Dane meteorologiczne dobowe ČHMÚ (Czechy)"
options.cz_meteo_daily.description = "czeskie dane meteorologiczne ČHMÚ: opad, temperatura średnia, maksymalna i minimalna; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.unspecified.description = "Polecenie nie wskazuje zbioru danych, którego archiwa mają trafić do magazynu"

[operations.sync_imgw_store.params.years]
label = "Lata archiwów"
question = "Z jakich lat pobrać archiwa do magazynu (np. „2000–2020”)?"
example = "2000-2020"
help = "Lata numeruje IMGW: archiwum danych hydrologicznych IMGW-PIB ma rok hydrologiczny (od 1 listopada poprzedniego roku do 31 października), meteorologicznych i ČHMÚ rok kalendarzowy. Dla dobowych danych meteorologicznych ČHMÚ lat się nie podaje."

[operations.sync_imgw_store.params.stations]
label = "Stacje ČHMÚ"
question = "Dla których stacji ČHMÚ pobrać pliki do magazynu? Podaj kody (identyfikatory WIGOS) albo nazwy stacji."
example = "0-203-1-001000"
help = "Pliki ČHMÚ są osobne dla każdej stacji, więc stacje są wymagane."

[operations.sync_imgw_store_by_plan]
label = "Pobranie do magazynu według planu"
description = "Pobierz do lokalnego magazynu IMGW dokładnie to, co wymienia zapisany plan sprawdzenia archiwów (wynik operacji „Sprawdź archiwa”): synchronizacja według planu, wykonaj plan, plan #5, pobierz według zapisanego planu; zapisuje w magazynie, wymaga sieci."
summary = "Gotowe. Wynik #{number}: magazyn IMGW zaktualizowany według planu — nowych wersji archiwów: {new_versions}, szeregów zbudowanych: {new_series}."

[operations.export_imgw_archive]
label = "Eksport zapisanych archiwów z magazynu"
description = "Wyeksportuj do CSV albo JSONL rekordy archiwów zapisanych w magazynie IMGW dla wybranego zbioru i lat: dane z archiwów jako tabela, rozpakowane archiwum, eksport z magazynu, bez internetu; zapisuje pliki w folderze wyniku."
summary = "Gotowe. Wynik #{number}: wyeksportowano archiwa — plików: {files}, rekordów: {rows}, format {format}; pliki są w folderze wyniku."

[operations.export_imgw_archive.params.dataset]
label = "Zbiór danych"
question = "Archiwa którego zbioru danych wyeksportować z magazynu?"
model_question = "Jakiego rodzaju dane i z jakiej sieci stacji dotyczy polecenie?"
help = "Eksportuję tylko to, co magazyn już ma; brakujące archiwa najpierw pobierz do magazynu."
options.pl_hydro_daily.label = "Dane hydrologiczne dobowe IMGW-PIB"
options.pl_hydro_daily.description = "dobowe dane hydrologiczne: stan wody, przepływ, temperatura wody; wodowskaz; stacje hydrologiczne IMGW-PIB; rzeki; codzienne; hydro dobowe"
options.pl_hydro_monthly.label = "Dane hydrologiczne miesięczne IMGW-PIB"
options.pl_hydro_monthly.description = "miesięczne dane hydrologiczne: minimalny, średni i maksymalny stan wody, przepływ i temperatura wody w miesiącu; stacje hydrologiczne IMGW-PIB; hydro miesięczne"
options.pl_hydro_semiannual.label = "Dane hydrologiczne półroczne i roczne IMGW-PIB"
options.pl_hydro_semiannual.description = "półroczne i roczne dane hydrologiczne: ekstrema stanu wody, przepływu i temperatury wody w półroczu zimowym, letnim i w roku; stacje hydrologiczne IMGW-PIB"
options.pl_meteo_climate_daily.label = "Dane klimatyczne dobowe IMGW-PIB"
options.pl_meteo_climate_daily.description = "dobowe dane klimatyczne: temperatura powietrza maksymalna, minimalna, średnia, przygruntowa, opad dobowy, pokrywa śnieżna; stacje klimatyczne IMGW-PIB"
options.pl_meteo_precip_daily.label = "Opady dobowe ze stacji opadowych IMGW-PIB"
options.pl_meteo_precip_daily.description = "dobowe opady, suma dobowa opadu, pokrywa śnieżna, świeży śnieg ze stacji opadowych IMGW-PIB; deszczomierz; opad dobowy"
options.cz_hydro_daily.label = "Dane hydrologiczne dobowe ČHMÚ (Czechy)"
options.cz_hydro_daily.description = "czeskie dane hydrologiczne ČHMÚ: stan wody, przepływ, temperatura wody; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.cz_meteo_daily.label = "Dane meteorologiczne dobowe ČHMÚ (Czechy)"
options.cz_meteo_daily.description = "czeskie dane meteorologiczne ČHMÚ: opad, temperatura średnia, maksymalna i minimalna; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.unspecified.description = "Polecenie nie wskazuje zbioru danych, którego archiwa mają być wyeksportowane"

[operations.export_imgw_archive.params.years]
label = "Lata archiwów"
question = "Z jakich lat wyeksportować archiwa (np. „2000–2020”)?"
example = "2000-2020"
help = "Lata numeruje IMGW: archiwum danych hydrologicznych IMGW-PIB ma rok hydrologiczny (od 1 listopada poprzedniego roku do 31 października), meteorologicznych i ČHMÚ rok kalendarzowy. Dla dobowych danych meteorologicznych ČHMÚ lat się nie podaje: eksportuję wszystko, co jest w magazynie."

[operations.export_imgw_archive.params.format]
label = "Format eksportu"
question = "W jakim formacie zapisać rekordy: CSV czy JSONL?"
model_question = "Jaki format plików wymienia polecenie: CSV (tabela) czy JSONL (JSON Lines, jeden rekord w wierszu)?"
help = "CSV to płaska tabela; JSONL zachowuje strukturę rekordu (pomiary z flagami) w jednym obiekcie JSON na wiersz."
options.csv.label = "CSV (tabela)"
options.csv.description = "CSV, tabela, arkusz, Excel, plik z kolumnami, rozdzielany przecinkami"
options.jsonl.label = "JSONL (JSON Lines)"
options.jsonl.description = "JSONL, JSON Lines, JSON, rekordy jako obiekty, jeden obiekt w wierszu"
options.unspecified.description = "Polecenie nie wskazuje formatu eksportu"

[operations.init_imgw_store]
label = "Utworzenie magazynu IMGW"
description = "Utwórz (zainicjuj) pusty lokalny magazyn IMGW w folderze z konfiguracji: pierwszy krok przed pobieraniem danych do magazynu, założenie magazynu danych; nie pobiera danych, nie zmienia istniejącego magazynu."
summary = "Gotowe. Wynik #{number}: magazyn IMGW jest gotowy: {store}."

[operations.inspect_imgw_store]
label = "Opis magazynu IMGW"
description = "Pokaż, co jest w lokalnym magazynie IMGW: czy magazyn jest gotowy, jakie wersje zawiera (archiwa, szeregi, katalogi stacji, komórki PMAXTP, obserwacje), problemy i sumy kontrolne SHA-256; co mam w magazynie; bez internetu."
summary = "Gotowe. Wynik #{number}: opis magazynu IMGW zapisano w wyniku (wpisów: {entries}, problemów: {problem_count})."

[operations.inspect_imgw_store.params.kind]
unset = "wszystkie rodzaje wpisów"
label = "Rodzaj wpisów"
question = "Jakich wpisów magazynu dotyczy opis: archiwów, szeregów, katalogów stacji, komórek PMAXTP, obserwacji czy problemów?"
model_question = "Czy polecenie ogranicza opis magazynu do jednego rodzaju wpisów: archiwów, szeregów, katalogów stacji, komórek PMAXTP, obserwacji albo problemów?"
help = "Bez wskazania rodzaju opisuję wszystkie wpisy magazynu."
options.archive.label = "Archiwa"
options.archive.description = "archiwa, pliki archiwalne, ZIP, pobrane archiwa danych"
options.series.label = "Szeregi"
options.series.description = "szeregi, szeregi czasowe, zbudowane szeregi stacji, Parquet"
options.catalog.label = "Katalogi stacji"
options.catalog.description = "katalogi stacji, katalog stacji, stations.geojson, lista stacji z położeniem"
options.pmaxtp.label = "Komórki PMAXTP"
options.pmaxtp.description = "PMAXTP, komórki PMAXTP, opady maksymalne, zapisane komórki siatki"
options.observation.label = "Obserwacje"
options.observation.description = "obserwacje, zapisane sygnały serwera, ETag, daty modyfikacji"
options.problem.label = "Problemy"
options.problem.description = "problemy, błędy, uszkodzone wersje, przerwane zapisy, nieprawidłowe wpisy"
options.unspecified.description = "Polecenie nie ogranicza opisu do jednego rodzaju wpisów"

[operations.inspect_imgw_store.params.provider]
unset = "obaj dostawcy (IMGW-PIB i ČHMÚ)"
label = "Dostawca danych"
question = "Wpisy którego dostawcy opisać: IMGW-PIB czy ČHMÚ?"
model_question = "Czy polecenie ogranicza opis magazynu do jednego dostawcy: IMGW-PIB (Polska) albo ČHMÚ (Czechy)?"
help = "Bez wskazania dostawcy opisuję wpisy obu dostawców."
options.imgw_pib.label = "IMGW-PIB (Polska)"
options.imgw_pib.description = "IMGW, IMGW-PIB, polskie stacje, Polska, Instytut Meteorologii i Gospodarki Wodnej"
options.chmi.label = "ČHMÚ (Czechy)"
options.chmi.description = "ČHMÚ, CHMU, CHMI, czeskie stacje, Czechy, Český hydrometeorologický ústav"
options.unspecified.description = "Polecenie nie ogranicza opisu do jednego dostawcy"

[operations.init_imgw_project]
label = "Utworzenie projektu danych IMGW"
description = "Utwórz projekt danych IMGW w folderze projektu (plik imgw-project.json z listą zadań) wskazujący magazyn IMGW z konfiguracji: projekt przypina wersje danych, aby wyniki dało się odtworzyć; założenie projektu, nowy projekt IMGW."
summary = "Gotowe. Wynik #{number}: projekt danych IMGW utworzony (manifest {manifest})."

[operations.add_imgw_project_task]
label = "Dodanie zadania do projektu danych IMGW"
description = "Dodaj zadanie do projektu danych IMGW: wybór szeregów czasowych stacji (stacja albo obszar z pliku GeoJSON, lata, zmienne: przepływy, opady, stany wody) albo komórka PMAXTP dla punktu; zadanie tylko zapisuje się w manifeście projektu, dane pobiera dopiero „Pobierz dane projektu”."
summary = "Gotowe. Wynik #{number}: dodano zadanie „{task}” do projektu IMGW (zadań w manifeście: {task_count})."

[operations.add_imgw_project_task.params.task]
label = "Rodzaj zadania"
question = "Jakie zadanie dodać do projektu: szeregi czasowe stacji czy komórkę PMAXTP?"
model_question = "Jakiego rodzaju zadanie wymienia polecenie: szeregi czasowe stacji (przepływy, opady, stany wody, temperatury) czy opady maksymalne PMAXTP dla punktu?"
help = "Zadanie szeregów wybiera stacje, lata i zmienne; zadanie PMAXTP zapisuje komórkę opadów maksymalnych dla punktu."
options.series.label = "Szeregi czasowe stacji"
options.series.description = "szeregi stacji, przepływy, opady, stany wody, temperatury, dane ze stacji, lata pomiarów"
options.pmaxtp.label = "Komórka PMAXTP"
options.pmaxtp.description = "PMAXTP, opady maksymalne, opady maksymalne prawdopodobne, punkt, współrzędne, komórka siatki"
options.unspecified.description = "Polecenie nie wskazuje, czy zadanie dotyczy szeregów stacji, czy PMAXTP"

[operations.add_imgw_project_task.params.task_name]
label = "Nazwa zadania"
question = "Jak nazwać zadanie? Nazwa: małe litery a–z, cyfry, „_” i „-”, do 64 znaków."
example = "opady_poznan"
help = "Nazwa musi być unikalna w projekcie, zaczynać się od litery lub cyfry i mieć tylko małe litery a–z, cyfry, „_” i „-” (np. „opady_poznan”). Nazwy nie poprawiam sam."

[operations.add_imgw_project_task.params.dataset]
label = "Zbiór danych"
question = "Z którego zbioru danych wybrać szeregi do zadania?"
model_question = "Jakiego rodzaju dane i z jakiej sieci stacji dotyczy polecenie?"
help = "Lista stacji IMGW nie mówi, czy stacja jest opadowa, czy klimatyczna; wskaż zbiór, a stację dopasuję do niego. Dane ČHMÚ dotyczą Czech."
options.pl_hydro_daily.label = "Dane hydrologiczne dobowe IMGW-PIB"
options.pl_hydro_daily.description = "dobowe dane hydrologiczne: stan wody, przepływ, temperatura wody; wodowskaz; stacje hydrologiczne IMGW-PIB; rzeki; codzienne; hydro dobowe"
