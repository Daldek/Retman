options.pl_hydro_monthly.description = "miesięczne dane hydrologiczne: minimalny, średni i maksymalny stan wody, przepływ i temperatura wody w miesiącu; stacje hydrologiczne IMGW-PIB; hydro miesięczne"
options.pl_hydro_semiannual.label = "Dane hydrologiczne półroczne i roczne IMGW-PIB"
options.pl_hydro_semiannual.description = "półroczne i roczne dane hydrologiczne: ekstrema stanu wody, przepływu i temperatury wody w półroczu zimowym, letnim i w roku; stacje hydrologiczne IMGW-PIB"
options.pl_meteo_climate_daily.label = "Dane klimatyczne dobowe IMGW-PIB"
options.pl_meteo_climate_daily.description = "dobowe dane klimatyczne: temperatura powietrza maksymalna, minimalna, średnia, przygruntowa, opad dobowy, pokrywa śnieżna; stacje klimatyczne IMGW-PIB"
options.pl_meteo_precip_daily.label = "Opady dobowe ze stacji opadowych IMGW-PIB"
options.pl_meteo_precip_daily.description = "dobowe opady, suma dobowa opadu, pokrywa śnieżna, świeży śnieg ze stacji opadowych IMGW-PIB; deszczomierz; opad dobowy"
options.cz_hydro_daily.label = "Dane hydrologiczne dobowe ČHMÚ (Czechy)"
options.cz_hydro_daily.description = "czeskie dane hydrologiczne ČHMÚ: stan wody, przepływ, temperatura wody; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.cz_meteo_daily.label = "Dane meteorologiczne dobowe ČHMÚ (Czechy)"
options.cz_meteo_daily.description = "czeskie dane meteorologiczne ČHMÚ: opad, temperatura średnia, maksymalna i minimalna; Czechy; CHMI; CHMU; WIGOS; stacje czeskie"
options.unspecified.description = "Polecenie nie wskazuje zbioru danych zadania"

[operations.add_imgw_project_task.params.selection]
label = "Wybór stacji"
question = "Czy wskazać stacje nazwą albo kodem, czy wybrać wszystkie stacje leżące w obszarze z pliku GeoJSON?"
model_question = "Czy polecenie wskazuje stacje (nazwą albo kodem), czy obszar z pliku GeoJSON, w którym leżą stacje?"
help = "Wybór obszarem czyta stacje z katalogu stacji w magazynie i zapisuje ich listę w zadaniu."
options.stations.label = "Wskazane stacje (nazwa lub kod)"
options.stations.description = "stacja, stacje, nazwa stacji, kod stacji, wodowskaz, posterunek, konkretne stacje"
options.area.label = "Stacje z obszaru (plik GeoJSON)"
options.area.description = "obszar, plik GeoJSON, geojson, zlewnia, granica, wszystkie stacje w obszarze, stacje w zlewni"
options.unspecified.description = "Polecenie nie mówi, czy wskazuje stacje, czy obszar"

[operations.add_imgw_project_task.params.stations]
label = "Stacje"
question = "Jakie stacje wybrać do zadania? Podaj nazwy albo kody stacji."
example = "Poznań-Ławica"
help = "Podaj jedną lub kilka stacji (nazwa albo kod: 9 cyfr dla IMGW-PIB, identyfikator WIGOS dla ČHMÚ)."

[operations.add_imgw_project_task.params.area_file]
label = "Plik obszaru (GeoJSON)"
question = "Jaki plik GeoJSON wyznacza obszar, w którym leżą stacje? Plik musi leżeć w folderze projektu."
example = "zlewnia.geojson"
help = "GeoJSON w WGS84 (Polygon, MultiPolygon, Feature albo FeatureCollection) w folderze projektu, bez „..” i dowiązań symbolicznych. Wymaga katalogu stacji w magazynie („Zbuduj katalog stacji IMGW”)."

[operations.add_imgw_project_task.params.period]
label = "Lata zadania"
question = "Z jakich lat ma być zadanie? Zadanie obejmuje całe lata, np. „2000–2020”."
example = "2000-2020"
help = "Zadanie wybiera całe lata (kalendarzowe albo hydrologiczne); okresu z datami (od dnia do dnia) zadanie nie przyjmuje. Podaj zakres lat, np. „2000–2020”."

[operations.add_imgw_project_task.params.year_type]
label = "Rodzaj roku"
question = "Czy lata zadania to lata kalendarzowe (od 1 stycznia do 31 grudnia), czy hydrologiczne (od 1 listopada do 31 października)?"
help = "Rok hydrologiczny „2020” trwa od 1 listopada 2019 do 31 października 2020. Pytam o to zawsze, gdy polecenie nie mówi wprost."
options.hydrological.label = "Lata hydrologiczne (1 XI – 31 X)"
options.calendar.label = "Lata kalendarzowe (1 I – 31 XII)"

[operations.add_imgw_project_task.params.variables]
unset = "wszystkie zmienne zbioru"
label = "Zmienne"
question = "Jakie zmienne uwzględnić w zadaniu (np. opad, przepływ, stan wody)?"
example = "przepływ i stan wody"
help = "Opcjonalnie zawęż zadanie do wybranych zmiennych zbioru (np. Q, H, P); bez tego zadanie obejmuje wszystkie zmienne zbioru."

[operations.add_imgw_project_task.params.point]
label = "Punkt"
question = "Dla jakiego punktu zapisać komórkę PMAXTP? Podaj szerokość i długość geograficzną (WGS84) albo współrzędne w PL-1992."
example = "52.23, 21.01"
help = "Punkt musi leżeć w obszarze danych PMAXTP (szerokość 49–55° N, długość 14–24,5° E)."

[operations.add_imgw_project_task.params.method]
label = "Metoda PMAXTP"
question = "Którą metodę opadów maksymalnych zastosować: POT czy AMP?"
model_question = "Jaką metodę opadów maksymalnych wymienia polecenie: POT (przekroczenia progu) czy AMP (maksima roczne)?"
help = "POT korzysta z przekroczeń progu (seria częściowa), AMP z maksimów rocznych."
options.pot.label = "POT (przekroczenia progu)"
options.pot.description = "POT, peaks over threshold, przekroczenia progu, seria częściowa"
options.amp.label = "AMP (maksima roczne)"
options.amp.description = "AMP, annual maximum, maksima roczne, seria maksimów rocznych"
options.unspecified.description = "Polecenie nie wskazuje metody PMAXTP"

[operations.download_imgw_project]
label = "Pobranie i przypięcie danych projektu IMGW"
description = "Pobierz do magazynu dane zadań projektu IMGW i zapisz w manifeście przypięte wersje (sumy SHA-256): odtworzenie przypiętych wersji (nowe zadania zostaną pobrane i przypięte po raz pierwszy) albo aktualizacja danych do najnowszych wersji ze zmianą przypięć; pobierz i przypnij dane projektu; zapisuje w magazynie i w manifeście, wymaga sieci."
summary = "Gotowe. Wynik #{number}: dane projektu IMGW pobrane — zadań przypiętych: {pinned_count} z {task_count}."

