[operations.get_pmaxtp]
label = "Opady maksymalne PMAXTP dla punktu"
description = "Pobierz z serwera IMGW opady maksymalne prawdopodobne PMAXTP dla punktu o podanych współrzędnych: tabela kwantyli opadu dla czasów trwania od 5 do 180 minut i prawdopodobieństw przewyższenia, metoda POT albo AMP, z możliwością zapisu komórki siatki w magazynie."
summary = "Gotowe. Wynik #{number}: tabela PMAXTP (metoda {method}) dla punktu {latitude}°N, {longitude}°E, wierszy: {rows}."

[operations.get_pmaxtp.params.point]
label = "Punkt"
