model_question = "Czy polecenie każe zapisać dane PMAXTP w magazynie albo mówi, że wynik ma być tylko w pliku?"
help = "Zapis w magazynie zachowuje komórkę siatki do późniejszego odczytu bez internetu; sam plik wyniku nie zostawia nic w magazynie."
options.none.label = "Tylko plik wyniku"
options.none.description = "tylko plik wyniku, bez zapisu w magazynie, jednorazowo, bez magazynu"
options.store.label = "Zapisz także w magazynie"
options.store.description = "zapisz w magazynie, zapamiętaj komórkę, zachowaj w magazynie, na później, do odczytu offline"
options.unspecified.description = "Polecenie nic nie mówi o zapisie w magazynie"

[operations.get_pmaxtp.params.probability]
unset = "wszystkie prawdopodobieństwa z tabeli PMAXTP"
label = "Prawdopodobieństwo"
