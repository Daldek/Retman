example = "52.23, 21.01"
help = "Podaj współrzędne w WGS84 (szerokość i długość geograficzna, np. 52.23 21.01) albo w PL-1992. PMAXTP obejmuje obszar Polski: szerokość 49–55°, długość 14–24,5°."

[operations.get_pmaxtp.params.method]
label = "Metoda obliczeń"
question = "Którą metodą pobrać PMAXTP: POT czy AMP?"
model_question = "Którą metodę obliczeń PMAXTP wymienia polecenie: POT czy AMP?"
help = "POT to metoda maksimów ponadprogowych, AMP — maksimów rocznych; wyniki obu metod różnią się."
options.pot.label = "POT (maksima ponadprogowe)"
options.pot.description = "POT, peaks over threshold, metoda ponadprogowa, maksima przekraczające próg"
options.amp.label = "AMP (maksima roczne)"
options.amp.description = "AMP, annual maximum precipitation, metoda maksimów rocznych, roczne maksima"
options.unspecified.description = "Polecenie nie podaje metody POT ani AMP"

[operations.get_pmaxtp.params.storage]
label = "Zapis w magazynie"
