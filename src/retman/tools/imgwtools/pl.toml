help = "Opcjonalny filtr wyniku: tabela PMAXTP zawiera kilka prawdopodobieństw, podaj te, które Cię interesują (np. 1% i 10%)."

[operations.get_pmaxtp.params.duration]
unset = "wszystkie czasy trwania z tabeli PMAXTP"
label = "Czas trwania opadu"
