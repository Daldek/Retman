[categories.spatial_data]
label = "GUGiK spatial data"
description = "Downloading spatial data from GUGiK: the DEM (NMT, numeryczny model terenu), the DSM (NMPT, numeryczny model pokrycia terenu), orthophoto (ortofotomapa), elevation cutouts (wycinki wysokościowe) and BDOT10k (topographic vector data); creating and inspecting the Kartograf store (the store marker, the data segments)"

[categories.soil_data]
label = "SoilGrids soil data"
description = "Soils from SoilGrids (ISRIC, 250 m grid): downloading the layer of one soil property (clay, sand or silt content, organic carbon, pH, bulk density, coarse fragments, cation exchange capacity, nitrogen) at a chosen depth, and the hydrologic soil groups HSG (A–D) of the SCS-CN method derived from the texture"

[operations.download_dem_sheet]
label = "Download DEM (NMT) for a map sheet or area"
description = "Download the DEM (NMT, numeryczny model terenu, DTM, ground elevation or terrain relief) from GUGiK for a sheet code (godło arkusza) or for an area from a geometry file."

[operations.download_dem_sheet.check]
notice = "I will query the GUGiK services (the WFS map sheet index and the PRG layer) for the years, resolutions and vertical reference systems available for the sheet code or the file from the plan. The 100 m DEM (voivodeship files) has no such sheet index, so I check nothing for it."

[operations.download_dem_sheet.params.area]
label = "Sheet code or DEM (NMT) area"
question = "For which sheet code or geometry file should I download the DEM (NMT, numeryczny model terenu)?"
help = "Give a PL-1992 or PL-2000 sheet code (godło), or an SHP/GPKG file. Kartograf expands a PL-1992 sheet code coarser than 1:10000 into 1:10000 map sheets; a PL-2000 sheet code (godło) at 1:10000 scale (e.g. 7.171.21) has no DEM (NMT) at that scale — use the child sheets operation. For a file, the 1:10000 map sheets (PL-1992) whose envelope touches the envelope of any feature are downloaded; the shape of the features is not taken into account. For each map sheet the latest available flight is downloaded; you do not choose the year or campaign."
example = "N-34-130-D-d-2-4"
geometry_note = "1:10000 map sheets (PL-1992) intersecting the envelope of any feature in the layer; the shape of the polygon is not taken into account"

[operations.download_dem_sheet.params.resolution]
label = "DEM (NMT) resolution"
question = "At what resolution should the DEM be downloaded: 0.15 m, 0.5 m, 0.6 m, 1 m, 5 m, 10 m or 100 m?"
model_question = "What resolution does the command mention?"
help = "In EVRF2007, 0.15 m, 0.5 m, 0.6 m, 1 m, 5 m and 10 m are available; in KRON86 only 0.5 m and 1 m. The 100 m DEM consists of XYZ files in ZIP archives per voivodeship, with no vertical reference system and not clipped to a map sheet."
options.0_15m.label = "0.15 m (EVRF2007 only)"
options.0_15m.description = "0.15 m — DEM (NMT) with a 15 centimetre pixel, 0.15 m, 15 cm (EVRF2007 only)"
options.0_5m.label = "0.5 m"
options.0_5m.description = "0.5 m — DEM (NMT) with a 50 centimetre pixel, 0.5 m, 50 cm, half a metre (this is not 5 m)"
options.0_6m.label = "0.6 m (EVRF2007 only)"
options.0_6m.description = "0.6 m — DEM (NMT) with a 60 centimetre pixel, 0.6 m, 60 cm (EVRF2007 only)"
options.1m.label = "1 m"
options.1m.description = "1 m — DEM (NMT), terrain model with a 1 metre pixel, 100 cm"
options.5m.label = "5 m (EVRF2007 only)"
options.5m.description = "5 m — DEM (NMT), terrain model with a 5 metre pixel (EVRF2007 only; this is not 0.5 m)"
options.10m.label = "10 m (EVRF2007 only)"
options.10m.description = "10 m — DEM (NMT), terrain model with a 10 metre pixel (EVRF2007 only)"
options.100m.label = "100 m (voivodeship files, no vertical reference system)"
options.100m.description = "100 m — DEM (NMT) of 100 metres, national grid, XYZ files in ZIP per voivodeship, no vertical reference system"
options.unspecified.description = "No resolution given — ask which one is meant"

[operations.download_dem_sheet.params.vertical_crs]
label = "DEM (NMT) vertical reference system"
question = "In which vertical reference system should the DEM be downloaded: EVRF2007 or KRON86?"
model_question = "What vertical reference system does the command mention?"
help = "KRON86 is available only for resolutions of 0.5 m and 1 m; the other resolutions exist only in EVRF2007."
options.evrf2007.label = "EVRF2007"
options.evrf2007.description = "EVRF2007 — European vertical reference system, PL-EVRF2007-NH, Amsterdam datum"
options.kron86.label = "KRON86 (0.5 m and 1 m only)"
options.kron86.description = "KRON86 — Kronstadt 86, PL-KRON86-NH (0.5 m and 1 m only)"
options.unspecified.description = "No vertical reference system given — ask whether EVRF2007 or KRON86"

[operations.download_sheet_hierarchy]
label = "Download child sheets (DEM, DSM or orthophoto)"
description = "Download the hierarchy of GUGiK child sheets: DEM (NMT, numeryczny model terenu, DTM, terrain relief), DSM (NMPT, numeryczny model pokrycia terenu) or an orthophoto (ortofotomapa, ortofoto, aerial photographs) in the RGB, CIR or black-and-white variant."

[operations.download_sheet_hierarchy.check]
notice = "I will query GUGiK services (the WFS sheet index and the PRG layer, or the WMS orthophoto index) for data on the sheet code or the file from the plan. For an orthophoto the index knows only the RGB variant; for CIR and black-and-white I check nothing."

[operations.download_sheet_hierarchy.params.product]
label = "Sheet data type"
question = "What data should be downloaded for the child sheets: DEM (NMT), DSM (NMPT) or an orthophoto?"
model_question = "What type of data does the command mention?"
help = "DEM (NMT) and DSM (NMPT) sheets store elevations (ASC grid), while an orthophoto is a georeferenced aerial photograph (GeoTIFF) in the chosen colour variant: RGB, CIR or black-and-white. For each sheet the latest available flight is downloaded; you do not choose the year or campaign."
options.dem.label = "DEM (NMT, digital terrain model)"
options.dem.description = "NMT — numeryczny model terenu, DEM, DTM, ground elevation and terrain relief"
options.dsm.label = "DSM (NMPT, digital surface model)"
options.dsm.description = "NMPT — numeryczny model pokrycia terenu, DSM, height of buildings and vegetation"
options.orthophoto.label = "Orthophoto"
options.orthophoto.description = "Ortofotomapa — ortofoto, orthophoto, georeferenced aerial photograph, flight images"
options.unspecified.description = "No product given — ask about NMT (DEM), NMPT (DSM) or orthophoto"

[operations.download_sheet_hierarchy.params.area]
label = "Parent sheet code or area"
question = "What is the sheet code of the parent sheet to expand, or the geometry file?"
help = "Give the sheet code of a coarser PL-1992 or PL-2000 sheet, or an SHP/GPKG file; the target scale must be more detailed. For a file, the sheets in the chosen scale whose bounding box touches the bounding box of any feature are downloaded; the shape of the features is not taken into account. I download an orthophoto only for a sheet code, not for a file."
example = "N-34-130-D-d-2"
geometry_note = "sheets in the chosen scale intersecting the bounding box of any feature in the layer; the polygon shape is not taken into account"

[operations.download_sheet_hierarchy.params.target_scale]
label = "Child sheet scale"
question = "To which Kartograf scale should the sheet code be expanded?"
model_question = "What target scale does the command mention?"
help = "PL-1992 sheets exist only at 1:10000 (the standard GUGiK sheet) — for a PL-1992 sheet code and for a file in PL-1992, choose 1:10000. The scales 1:5000, 1:2000, 1:1000 and 1:500 belong to PL-2000 (GUGiK most often publishes 1:2000). The scale must be finer than the scale of the parent sheet code and match its coordinate system."
options.scale_10000.label = "1:10000 (PL-1992)"
options.scale_10000.description = "1:10000 — standard PL-1992 DEM/DSM/orthophoto sheets (the only PL-1992 sheet scale)"
options.scale_5000.label = "1:5000 (PL-2000)"
options.scale_5000.description = "1:5000 — PL-2000 sheets in a separate branch of the division"
options.scale_2000.label = "1:2000 (PL-2000)"
options.scale_2000.description = "1:2000 — a common scale of PL-2000 DEM and orthophoto sheets"
options.scale_1000.label = "1:1000 (PL-2000)"
options.scale_1000.description = "1:1000 — detailed PL-2000 sheets"
options.scale_500.label = "1:500 (PL-2000)"
options.scale_500.description = "1:500 — the most detailed PL-2000 sheets"
options.unspecified.description = "No target scale given — ask"

[operations.download_sheet_hierarchy.params.resolution]
label = "DEM resolution"
question = "At what resolution should the DEM sheets be downloaded: 0.15 m, 0.5 m, 0.6 m, 1 m, 5 m or 10 m?"
model_question = "What DEM resolution does the command mention?"
help = "In the EVRF2007 system, 0.15 m, 0.5 m, 0.6 m, 1 m, 5 m and 10 m are available; in KRON86 only 0.5 m and 1 m."
options.0_15m.label = "0.15 m (EVRF2007 only)"
options.0_15m.description = "0.15 m — 15 centimetre pixel, 0.15 m, 15 cm (EVRF2007 only)"
options.0_5m.label = "0.5 m"
options.0_5m.description = "0.5 m — 50 centimetre pixel, 0.5 m, 50 cm, half a metre (not 5 m)"
options.0_6m.label = "0.6 m (EVRF2007 only)"
options.0_6m.description = "0.6 m — 60 centimetre pixel, 0.6 m, 60 cm (EVRF2007 only)"
options.1m.label = "1 m"
options.1m.description = "1 m — 1 metre pixel, 100 cm"
options.5m.label = "5 m (EVRF2007 only)"
options.5m.description = "5 m — 5 metre pixel (EVRF2007 only; not 0.5 m)"
options.10m.label = "10 m (EVRF2007 only)"
options.10m.description = "10 m — 10 metre pixel (EVRF2007 only)"
options.unspecified.description = "No resolution given — ask which one is meant"

[operations.download_sheet_hierarchy.params.resolution_dsm]
label = "DSM (NMPT) resolution"
question = "In what resolution should the DSM (NMPT) sheets be downloaded: 0.5 m, 0.6 m or 1 m?"
model_question = "What DSM (NMPT) resolution does the command mention?"
help = "DSM (NMPT) in EVRF2007: 0.5 m, 0.6 m and 1 m; in KRON86 only 0.5 m and 1 m."
options.0_5m.label = "0.5 m"
options.0_5m.description = "0.5 m — 50 centimetre pixel, 0.5 m, 50 cm, half a metre"
options.0_6m.label = "0.6 m (EVRF2007 only)"
options.0_6m.description = "0.6 m — 60 centimetre pixel, 0.6 m, 60 cm (EVRF2007 only)"
options.1m.label = "1 m"
options.1m.description = "1 m — 1 metre pixel, 100 cm"
options.unspecified.description = "No DSM (NMPT) resolution given — ask which one is meant"

[operations.download_sheet_hierarchy.params.vertical_crs]
label = "Vertical datum of the sheets"
question = "In which vertical datum should the sheets be downloaded: EVRF2007 or KRON86?"
model_question = "What vertical datum does the command mention?"
help = "Applies to DEM (NMT) and DSM (NMPT). KRON86 is available only for resolutions of 0.5 m and 1 m."
options.evrf2007.label = "EVRF2007"
options.evrf2007.description = "EVRF2007 — European vertical reference system, Amsterdam reference level"
options.kron86.label = "KRON86 (0.5 m and 1 m only)"
options.kron86.description = "KRON86 — Kronstadt 86, historical system (0.5 m and 1 m only)"
options.unspecified.description = "No vertical datum given — ask about EVRF2007 or KRON86"

[operations.download_sheet_hierarchy.params.color]
label = "Orthophoto colour variant"
question = "In which colour variant should the orthophoto be downloaded: RGB (natural colours), CIR (near infrared) or black and white?"
model_question = "What orthophoto colour variant does the command mention?"
help = "GUGiK publishes the same map sheet in three variants: RGB (natural colours), CIR (near-infrared colour, vegetation shown in red) and black-and-white (B/W). If a sheet has no data in the chosen variant, GUGiK has nothing to offer; I do not substitute another variant."
options.rgb.label = "RGB (natural colours)"
options.rgb.description = "RGB — orthophoto in natural colours, true colour, an ordinary aerial photograph (colour alone, without a mention of infrared, does not decide between RGB and CIR)"
options.cir.label = "CIR (near infrared)"
options.cir.description = "CIR — near-infrared orthophoto, colour infrared, false colours, vegetation in red, infrared"
options.bw.label = "Black-and-white (B/W)"
options.bw.description = "B/W — black-and-white orthophoto, greyscale, shades of grey, panchromatic"
options.unspecified.description = "No colour variant given — ask about RGB, CIR or black-and-white"

[operations.download_elevation_cutout]
label = "1 m DEM (NMT) or DSM (NMPT) cutout for a rectangle or area"
description = "Download a single GeoTIFF elevation cutout from the GUGiK WCS: DEM (NMT, numeryczny model terenu, DTM, terrain relief) or DSM (NMPT, numeryczny model pokrycia terenu) for a coordinate rectangle or the bounding box of a geometry file."

[operations.download_elevation_cutout.check]
notice = "I will query the GUGiK services (the WFS sheet index and the PRG layer) for data covering the rectangle or the file from the plan. The cutout is assembled by the WCS server, so the sheet index only approximates what the result will contain."

[operations.download_elevation_cutout.params.product]
label = "Cutout product"
question = "Should the cutout contain DEM (NMT, terrain) or DSM (NMPT, land cover)?"
model_question = "What kind of data does the command mention?"
help = "A WCS cutout always has a resolution of 1 m (the only resolution in this mode) and comes from a composite of flights on the GUGiK server; you choose neither the year nor the campaign — the year is chosen when downloading sheets."
options.dem.label = "DEM (NMT, numeryczny model terenu)"
options.dem.description = "NMT — numeryczny model terenu, DEM, DTM, terrain relief"
options.dsm.label = "DSM (NMPT, numeryczny model pokrycia terenu)"
options.dsm.description = "NMPT — numeryczny model pokrycia terenu, DSM, buildings and trees"
options.unspecified.description = "No product given — ask about NMT or NMPT"

[operations.download_elevation_cutout.params.area]
label = "Cutout rectangle or area"
question = "Which coordinate rectangle or geometry file should be cut from the elevation data?"
help = "Give the rectangle bounds in PL-1992 (EPSG:2180) or WGS84 (EPSG:4326), or an SHP/GPKG file. For a file, the cutout covers the rectangle of all its features and is not clipped to their shape; there is no data only outside the land area of Poland."
example = "530000,382000,530100,382100 EPSG:2180"
geometry_note = "a single rectangle covering all features of the layer; does not clip to the polygon; no data outside the land area of Poland"

[operations.download_elevation_cutout.params.target_crs]
label = "Output coordinate system"
question = "Which coordinate system should the cutout be saved in?"
help = "The result is a single GeoTIFF file. EPSG:2180 is PL-1992; EPSG:5514 is S-JTSK, EPSG:3045 is ETRS89/TM33. The code can be given with a prefix (EPSG:2180), as a number alone (2180) or by name (PL-1992). In the command I recognise the output system by the words “wynik”, “do”, “przelicz”, “zapisz”, “docelowy”; a system given right after the coordinates is treated as the system of the rectangle."
options.epsg_2180.label = "EPSG:2180 (PL-1992)"
options.epsg_5514.label = "EPSG:5514 (S-JTSK)"
options.epsg_3045.label = "EPSG:3045 (ETRS89/TM33)"

[operations.download_elevation_cutout.params.vertical_crs]
label = "Vertical reference system of the cutout"
question = "Which vertical reference system should be chosen for the 1 m DEM/DSM cutout?"
model_question = "What vertical reference system does the command mention?"
help = "The 1 m DEM (NMT) and DSM (NMPT) WCS cutout supports EVRF2007 or KRON86."
options.evrf2007.label = "EVRF2007"
options.evrf2007.description = "EVRF2007 — European vertical reference system, Amsterdam datum"
options.kron86.label = "KRON86"
options.kron86.description = "KRON86 — Kronstadt 86"
options.unspecified.description = "No vertical reference system given — ask about EVRF2007 or KRON86"

[operations.download_bdot10k]
label = "Download BDOT10k (current county packages)"
description = "Download BDOT10k (the Topographic Objects Database, topographic vectors and land cover) for a TERYT county, a sheet code (godło), a rectangle or a geometry file."

[operations.download_bdot10k.check]
notice = "I will ask the PRG GUGiK service which counties the area from the plan intersects, and check whether their BDOT10k packages are already in the store. For a TERYT code I do not connect to the network."

[operations.download_bdot10k.params.area]
label = "BDOT10k area"
question = "For which county (TERYT), map sheet, rectangle or geometry file should BDOT10k be downloaded?"
help = "A county TERYT code has 4 digits. For a rectangle, a sheet code (godło) or a file, the full, current package of every county intersected by the area's bounding box is downloaded (all layers), not clipped to the area; Kartograf rejects an area with more than 100 packages or more than 10 GB."
example = "TERYT 2264 or N-34-130-D-d-2-4"
geometry_note = "full packages of all counties intersecting the area's bounding box; the county list is known only after querying PRG (network, after confirmation)"

[operations.download_bdot10k.params.format]
label = "BDOT10k format"
question = "Should the BDOT10k vectors be saved as GeoPackage or Shapefile?"
model_question = "What file format does the command mention?"
help = "GeoPackage is one .gpkg file per county. Kartograf returns Shapefile as a ZIP archive; Retman extracts all .shp files together with their accompanying files into the result folder."
options.gpkg.label = "GeoPackage (.gpkg)"
options.gpkg.description = "GeoPackage (.gpkg, GPKG) — SQLite geospatial database, a single file"
options.shp.label = "Shapefile (.shp)"
options.shp.description = "Shapefile (.shp, SHP) — all layers from the ZIP package together with .dbf/.shx/.prj"
options.unspecified.description = "No format given — ask about GeoPackage or Shapefile"

[operations.init_kartograf_store]
label = "Create the Kartograf store"
description = "Create (initialise) the Kartograf store in the folder from the configuration: write the store marker kartograf-store.json into a new or empty folder, or into a folder that has the layout of a store but no marker (the tool checks the layout first); the first step when Kartograf refuses to write into a store without its marker, setting up the data store (magazyn danych) for GUGiK spatial data, a new Kartograf store; does not download data and does not change an existing store."
summary = "Done. Result #{number}: the Kartograf store is ready: {store}."

[operations.inspect_kartograf_store]
label = "Overview of the Kartograf store"
description = "Show what the Kartograf store holds: its segments (product folders) with the product, the country, the dataset and whether the installed Kartograf knows them; which GUGiK and SoilGrids data are already downloaded, what is in the spatial data store; read-only, offline, downloads nothing."
summary = "Done. Result #{number}: the Kartograf store {store} has {segment_count} segments."

[operations.download_soil_layer]
label = "Download a SoilGrids soil layer"
description = "Download one soil property layer from SoilGrids (ISRIC, 250 m, soil grids, soil map, soil data) for a sheet code, a rectangle or a geometry file: clay, sand or silt content (texture, particle size fractions), organic carbon, pH, bulk density, coarse fragments, cation exchange capacity (CEC) or nitrogen, at a chosen depth and with a prediction statistic (mean, median, quantile, uncertainty)."
summary = "Done. Result #{number}: the SoilGrids layer {property} {depth} ({stat}) is in the store; the file values are in {unit}, in {conventional_unit} after division by {divisor}."

[operations.download_soil_layer.check]
notice = "I will ask the SoilGrids service (ISRIC, GetCapabilities) for the current edition of the layer from the plan and compare it with the version in the store. I download nothing."

[operations.download_soil_layer.params.property]
label = "Soil property"
question = "Which soil property should be downloaded: clay, sand, silt, organic carbon, pH, bulk density, coarse fragments, cation exchange capacity or nitrogen?"
model_question = "What soil property does the command mention?"
help = "SoilGrids stores the values in integer units of its own (for example clay in g/kg, the pH times 10); the result gives the unit of the file and the divisor to the conventional unit. Organic carbon has three measures, which I ask about separately."
options.clay.label = "Clay (clay content)"
options.clay.description = "clay — clay content, clay fraction, particles below 0.002 mm, g/kg (percent = value / 10)"
options.sand.label = "Sand (sand content)"
options.sand.description = "sand — sand content, sand fraction, g/kg (percent = value / 10)"
options.silt.label = "Silt (silt content)"
options.silt.description = "silt — silt content, silt fraction, g/kg (percent = value / 10)"
options.organic_carbon.label = "Organic carbon"
options.organic_carbon.description = "soil organic carbon: content (SOC), density (OCD) or stock (OCS), organic matter, humus"
options.phh2o.label = "Soil pH (in water)"
options.phh2o.description = "phh2o — soil reaction, pH in water (H2O), soil acidity (file: pH times 10)"
options.bdod.label = "Bulk density"
options.bdod.description = "bdod — bulk density of the fine earth, cg/cm³ (kg/dm³ = value / 100)"
options.cfvo.label = "Coarse fragments"
options.cfvo.description = "cfvo — coarse fragments by volume, stones and gravel in the soil, cm³/dm³"
options.cec.label = "Cation exchange capacity (CEC)"
options.cec.description = "cec — cation exchange capacity, CEC, mmol(c)/kg"
options.nitrogen.label = "Total nitrogen"
options.nitrogen.description = "nitrogen — total nitrogen in the soil, N, cg/kg (g/kg = value / 100)"
options.unspecified.description = "No soil property given — ask"

[operations.download_soil_layer.params.carbon]
label = "Organic carbon measure"
question = "Which measure of organic carbon should be downloaded: content (SOC, g/kg), density (OCD, kg/m³) or stock (OCS, t/ha, 0–30 cm only)?"
model_question = "What measure of organic carbon does the command mention?"
help = "The content (SOC) is the mass of carbon in a kilogram of soil, the density (OCD) the mass of carbon in a cubic metre of soil, and the stock (OCS) the carbon of the 0–30 cm layer per hectare: the stock has only this one depth."
options.soc.label = "Organic carbon content (SOC)"
options.soc.description = "soc — soil organic carbon content, SOC, dg/kg (g/kg = value / 10)"
options.ocd.label = "Organic carbon density (OCD)"
options.ocd.description = "ocd — organic carbon density, OCD, hg/m³ (kg/m³ = value / 10)"
options.ocs.label = "Organic carbon stock (OCS, 0–30 cm only)"
options.ocs.description = "ocs — organic carbon stock, OCS, t/ha in the 0–30 cm layer"
options.unspecified.description = "No measure of organic carbon given (content, density or stock) — ask"

[operations.download_soil_layer.params.depth]
label = "Soil layer depth"
question = "From which depth should the layer be downloaded: 0–5, 5–15, 15–30, 30–60, 60–100 or 100–200 cm (organic carbon stock OCS: 0–30 cm)?"
model_question = "What soil depth interval does the command mention?"
help = "SoilGrids publishes six depth intervals below the surface; the organic carbon stock (OCS) has only the 0–30 cm interval, which the other properties do not have."
options.0_5cm.label = "0–5 cm"
options.0_5cm.description = "0–5 cm — the shallowest interval, at the surface, 0-5cm"
options.5_15cm.label = "5–15 cm"
options.5_15cm.description = "5–15 cm — 5-15cm"
options.15_30cm.label = "15–30 cm"
options.15_30cm.description = "15–30 cm — 15-30cm"
options.30_60cm.label = "30–60 cm"
options.30_60cm.description = "30–60 cm — 30-60cm, subsoil"
options.60_100cm.label = "60–100 cm"
options.60_100cm.description = "60–100 cm — 60-100cm"
options.100_200cm.label = "100–200 cm"
options.100_200cm.description = "100–200 cm — from 1 to 2 m, 100-200cm, the deepest interval"
options.0_30cm.label = "0–30 cm (organic carbon stock OCS only)"
options.0_30cm.description = "0–30 cm — 0-30cm, the whole topsoil; the organic carbon stock (OCS) only"
options.unspecified.description = "No depth given — ask"

[operations.download_soil_layer.params.stat]
label = "Prediction statistic"
question = "Which SoilGrids prediction statistic should be downloaded: the mean, the median, the 5% or 95% quantile, or the uncertainty?"
model_question = "What statistic (mean, median, quantile, uncertainty) does the command mention?"
help = "SoilGrids is a model prediction: the mean and the median (Q0.5) are the predicted value, the 5% and 95% quantiles bound the 90% interval, and the uncertainty is 10 × (Q0.95 − Q0.05) / Q0.5, without a unit."
options.mean.label = "Mean"
options.mean.description = "mean — mean of the prediction, average value"
options.q0_5.label = "Median (Q0.5)"
options.q0_5.description = "Q0.5 — median, 50% quantile, middle value"
options.q0_05.label = "5% quantile (Q0.05)"
options.q0_05.description = "Q0.05 — 5th percentile, lower bound of the prediction interval"
options.q0_95.label = "95% quantile (Q0.95)"
options.q0_95.description = "Q0.95 — 95th percentile, upper bound of the prediction interval"
options.uncertainty.label = "Uncertainty"
options.uncertainty.description = "uncertainty — prediction uncertainty, spread, model error"
options.unspecified.description = "No statistic given — ask"

[operations.download_soil_layer.params.area]
label = "Soil layer area"
question = "For which sheet code, rectangle or geometry file should the SoilGrids layer be downloaded?"
help = "Give a PL-1992 or PL-2000 sheet code, the bounds of a rectangle in PL-1992 (EPSG:2180) or WGS84 (EPSG:4326), or an SHP/GPKG file. For a sheet code the layer covers the rectangle of the sheet, for a file the rectangle of all its features; the result is not clipped to the shape. The SoilGrids grid is 250 m, so a small area is a few pixels."
example = "N-34-130-D or 16.90 52.40 16.95 52.45"
geometry_note = "a single rectangle covering all features of the layer; does not clip to the polygon"

[operations.classify_soil_hsg]
label = "SoilGrids hydrologic soil groups (HSG)"
description = "Compute the hydrologic soil groups HSG (A, B, C, D) of the SCS-CN method (CN, curve number, runoff, infiltration) from the SoilGrids texture for a sheet code, a rectangle or a geometry file: Kartograf downloads the clay, sand and silt content of one depth and classifies the soil texture (USDA) into the groups; the result is a raster of the groups with the share and the area of each group."
summary = "Done. Result #{number}: hydrologic soil groups ({depth}): A {groups[A][percent]}%, B {groups[B][percent]}%, C {groups[C][percent]}%, D {groups[D][percent]}%, no data {groups[nodata][percent]}%."

[operations.classify_soil_hsg.check]
notice = "I will ask the SoilGrids service (ISRIC, GetCapabilities) for the current edition of the clay, sand and silt layers from the plan and check whether the store holds them and the groups computed from them. I download and compute nothing."

[operations.classify_soil_hsg.params.depth]
label = "Texture depth"
question = "From which depth should the texture for the HSG be taken: 0–5, 5–15, 15–30, 30–60, 60–100 or 100–200 cm?"
model_question = "What soil depth interval does the command mention?"
help = "The groups are computed from the mean clay, sand and silt content of SoilGrids at one depth interval; usually the layer at the surface (0–5 cm) or the interval that governs infiltration."
options.0_5cm.label = "0–5 cm"
options.0_5cm.description = "0–5 cm — the shallowest interval, at the surface, 0-5cm"
options.5_15cm.label = "5–15 cm"
options.5_15cm.description = "5–15 cm — 5-15cm"
options.15_30cm.label = "15–30 cm"
options.15_30cm.description = "15–30 cm — 15-30cm"
options.30_60cm.label = "30–60 cm"
options.30_60cm.description = "30–60 cm — 30-60cm, subsoil"
options.60_100cm.label = "60–100 cm"
options.60_100cm.description = "60–100 cm — 60-100cm"
options.100_200cm.label = "100–200 cm"
options.100_200cm.description = "100–200 cm — from 1 to 2 m, 100-200cm, the deepest interval"
options.unspecified.description = "No depth given — ask"

[operations.classify_soil_hsg.params.area]
label = "HSG area"
question = "For which sheet code, rectangle or geometry file should the HSG be computed?"
help = "Give a PL-1992 or PL-2000 sheet code, the bounds of a rectangle in PL-1992 (EPSG:2180) or WGS84 (EPSG:4326), or an SHP/GPKG file. For a sheet code the groups cover the rectangle of the sheet, for a file the rectangle of all its features; the result is not clipped to the shape. The SoilGrids grid is 250 m."
example = "N-34-130-D"
geometry_note = "a single rectangle covering all features of the layer; does not clip to the polygon"

