[categories.spatial_data]
label = "Dane przestrzenne GUGiK"
description = "Pobieranie danych przestrzennych z GUGiK: numeryczny model terenu NMT, numeryczny model pokrycia terenu NMPT, ortofotomapa (arkusze i wycinek obszaru), wycinki wysokościowe, BDOT10k (wektory topograficzne), BDOO i pokrycie terenu CORINE Land Cover; założenie i przegląd magazynu Kartografa (znacznik magazynu, segmenty danych)"

[categories.soil_data]
label = "Dane glebowe SoilGrids"
description = "Gleby z SoilGrids (ISRIC, siatka 250 m): pobranie warstwy jednej właściwości gleby (zawartość iłu, piasku albo pyłu, węgiel organiczny, pH, gęstość objętościowa, części szkieletowe, pojemność wymiany kationów, azot) na wybranej głębokości, grupy hydrologiczne gleb HSG (A–D) metody SCS-CN wyznaczone z uziarnienia obszaru pobranego z SoilGrids oraz grupy HSG z gotowych rastrów zawartości iłu, piasku i pyłu (wcześniejszych wyników albo plików GeoTIFF)"

[operations.download_dem_sheet]
label = "Pobranie NMT dla arkusza lub obszaru"
description = "Pobierz NMT dla godła arkusza albo dla obszaru z pliku geometrii: numeryczny model terenu, DEM, DTM, wysokości gruntu lub rzeźba terenu z GUGiK."

[operations.download_dem_sheet.check]
notice = "Zapytam usługi GUGiK (skorowidz arkuszy WFS i warstwę PRG) o lata, rozdzielczości i układy wysokościowe dla godła albo pliku z planu. NMT 100 m (pliki województw) nie ma takiego skorowidza i niczego nie sprawdzam."

[operations.download_dem_sheet.params.area]
label = "Godło arkusza lub obszar NMT"
question = "Dla jakiego godła arkusza albo pliku geometrii mam pobrać NMT (numeryczny model terenu)?"
help = "Podaj godło PL-1992 albo PL-2000 albo plik SHP/GPKG. Godło PL-1992 grubsze niż 1:10000 Kartograf rozwinie na arkusze 1:10000; godło PL-2000 w skali 1:10000 (np. 7.171.21) nie ma NMT w tej skali — użyj operacji arkuszy potomnych. Dla pliku pobierane są arkusze 1:10000 (PL-1992), których obwiednia styka się z obwiednią któregokolwiek obiektu; kształt obiektów nie jest uwzględniany. Dla każdego arkusza pobierany jest najnowszy dostępny lot; roku i kampanii nie wybierasz."
example = "N-34-130-D-d-2-4"
geometry_note = "arkusze 1:10000 (PL-1992) przecinające obwiednię któregokolwiek obiektu warstwy; kształt wieloboku nie jest uwzględniany"

