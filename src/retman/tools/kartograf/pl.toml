help = "Podaj granice prostokąta w PL-1992 (EPSG:2180) lub WGS84 (EPSG:4326) albo plik SHP/GPKG. Dla pliku wycinek obejmuje prostokąt wszystkich jego obiektów i nie jest przycinany do kształtu; brak danych jest tylko poza lądem Polski."
