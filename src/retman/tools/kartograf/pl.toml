[operations.init_kartograf_store]
label = "Utworzenie magazynu Kartografa"
description = "Utwórz (zainicjuj) magazyn Kartografa w folderze z konfiguracji: zapisz znacznik magazynu kartograf-store.json w nowym albo pustym folderze albo w folderze z układem magazynu bez znacznika (narzędzie najpierw sprawdza układ); pierwszy krok, gdy Kartograf odmawia zapisu w magazynie bez znacznika, założenie magazynu danych przestrzennych GUGiK, nowy magazyn Kartografa; nie pobiera danych, nie zmienia istniejącego magazynu."
summary = "Gotowe. Wynik #{number}: magazyn Kartografa jest gotowy: {store}."

